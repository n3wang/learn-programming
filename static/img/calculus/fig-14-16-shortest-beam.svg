<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <rect width="360" height="300" fill="#fff"/>
  <!-- ground -->
  <line x1="20" y1="260" x2="340" y2="260" stroke="#333" stroke-width="2"/>
  <!-- wall (height 10) -->
  <rect x="140" y="160" width="18" height="100" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <text x="122" y="155" font-size="13" font-family="serif">10</text>
  <text x="128" y="280" font-size="12" font-family="serif">wall</text>
  <!-- building -->
  <line x1="260" y1="40" x2="260" y2="260" stroke="#333" stroke-width="2.5"/>
  <text x="268" y="90" font-size="12" font-family="serif">building</text>
  <!-- gap 8 -->
  <line x1="158" y1="270" x2="260" y2="270" stroke="#666" stroke-width="1"/>
  <text x="200" y="285" font-size="13" font-family="serif">8</text>
  <!-- beam L -->
  <line x1="60" y1="260" x2="260" y2="50" stroke="#1a4a8a" stroke-width="2.5"/>
  <text x="150" y="120" font-size="14" font-family="serif" fill="#1a4a8a">L</text>
  <!-- x from foot to wall -->
  <line x1="60" y1="250" x2="140" y2="250" stroke="#c45c26" stroke-width="1.5"/>
  <text x="90" y="245" font-size="13" font-family="serif" fill="#c45c26">x</text>
  <!-- y on building -->
  <line x1="265" y1="50" x2="265" y2="260" stroke="#2a7a3a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="275" y="150" font-size="14" font-family="serif" fill="#2a7a3a">y</text>
  <!-- foot mark -->
  <circle cx="60" cy="260" r="3" fill="#1a4a8a"/>
</svg>
