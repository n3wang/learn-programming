<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <rect width="520" height="280" fill="#fff"/>
  <!-- (a) point symmetry wrt line -->
  <text x="20" y="24" font-size="13" font-family="Georgia, serif">(a) Symmetric wrt a line </text>
  <line x1="40" y1="160" x2="200" y2="80" stroke="#2a7a3a" stroke-width="2"/>
  <text x="175" y="75" font-size="12" fill="#2a7a3a"></text>
  <circle cx="70" cy="100" r="4" fill="#1a4a8a"/><text x="55" y="95" font-size="12">P</text>
  <circle cx="170" cy="140" r="4" fill="#1a4a8a"/><text x="176" y="155" font-size="12">Q</text>
  <line x1="70" y1="100" x2="170" y2="140" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="120" cy="120" r="3" fill="#c45c26"/>
  <!-- (b) curve symmetric wrt line -->
  <text x="260" y="24" font-size="13" font-family="Georgia, serif">(b) Curve · axis of symmetry</text>
  <ellipse cx="380" cy="130" rx="90" ry="55" fill="none" stroke="#1a4a8a" stroke-width="2"/>
  <line x1="380" y1="50" x2="380" y2="210" stroke="#2a7a3a" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="386" y="60" font-size="12" fill="#2a7a3a">axis</text>
  <circle cx="320" cy="100" r="3" fill="#c45c26"/><text x="300" y="95" font-size="11">P</text>
  <circle cx="440" cy="100" r="3" fill="#c45c26"/><text x="446" y="95" font-size="11">Q</text>
  <text x="140" y="260" font-size="12" font-family="Georgia, serif" fill="#555">Fig. 15-2  reflection in a line</text>
</svg>
