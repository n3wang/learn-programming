<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="540" height="220">
  <rect width="540" height="220" fill="#fff"/>
  <!-- axes shared style -->
  <!-- (a) y-axis symmetry -->
  <g transform="translate(0,0)">
    <text x="50" y="22" font-size="13" font-family="Georgia, serif">(a) y-axis</text>
    <line x1="90" y1="40" x2="90" y2="180" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="110" x2="160" y2="110" stroke="#333" stroke-width="1"/>
    <circle cx="130" cy="70" r="4" fill="#1a4a8a"/><text x="136" y="66" font-size="11">(x,y)</text>
    <circle cx="50" cy="70" r="4" fill="#c45c26"/><text x="8" y="66" font-size="11">(x,y)</text>
    <line x1="50" y1="70" x2="130" y2="70" stroke="#888" stroke-dasharray="3 2"/>
  </g>
  <!-- (b) x-axis -->
  <g transform="translate(180,0)">
    <text x="50" y="22" font-size="13" font-family="Georgia, serif">(b) x-axis</text>
    <line x1="90" y1="40" x2="90" y2="180" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="110" x2="160" y2="110" stroke="#333" stroke-width="1"/>
    <circle cx="130" cy="70" r="4" fill="#1a4a8a"/><text x="136" y="66" font-size="11">(x,y)</text>
    <circle cx="130" cy="150" r="4" fill="#c45c26"/><text x="136" y="168" font-size="11">(x,y)</text>
    <line x1="130" y1="70" x2="130" y2="150" stroke="#888" stroke-dasharray="3 2"/>
  </g>
  <!-- (c) origin -->
  <g transform="translate(360,0)">
    <text x="45" y="22" font-size="13" font-family="Georgia, serif">(c) origin</text>
    <line x1="90" y1="40" x2="90" y2="180" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="110" x2="160" y2="110" stroke="#333" stroke-width="1"/>
    <circle cx="130" cy="70" r="4" fill="#1a4a8a"/><text x="136" y="66" font-size="11">(x,y)</text>
    <circle cx="50" cy="150" r="4" fill="#c45c26"/><text x="8" y="168" font-size="11">(x,y)</text>
    <line x1="50" y1="150" x2="130" y2="70" stroke="#888" stroke-dasharray="3 2"/>
    <circle cx="90" cy="110" r="3" fill="#2a7a3a"/>
  </g>
  <text x="160" y="208" font-size="12" font-family="Georgia, serif" fill="#555">Fig. 15-3  reflections in axes and origin</text>
</svg>
