<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <rect width="560" height="220" fill="#fff"/>
  <!-- (a) cup -->
  <text x="70" y="22" font-size="13" font-family="Georgia, serif">(a) Concave upward</text>
  <path d="M 30 80 Q 100 180, 170 80" fill="none" stroke="#1a4a8a" stroke-width="3"/>
  <line x1="55" y1="130" x2="145" y2="130" stroke="#c45c26" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- (b) cap -->
  <text x="250" y="22" font-size="13" font-family="Georgia, serif">(b) Concave downward</text>
  <path d="M 210 140 Q 280 40, 350 140" fill="none" stroke="#1a4a8a" stroke-width="3"/>
  <line x1="235" y1="90" x2="325" y2="90" stroke="#c45c26" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- (c) mixed A-B-C-D -->
  <text x="400" y="22" font-size="13" font-family="Georgia, serif">(c) Mixed</text>
  <path d="M 380 60 C 410 40, 430 100, 450 120 C 470 140, 490 80, 520 100 C 540 110, 545 160, 555 180"
        fill="none" stroke="#1a4a8a" stroke-width="2.5"/>
  <circle cx="390" cy="55" r="3" fill="#333"/><text x="378" y="48" font-size="11">A</text>
  <circle cx="450" cy="120" r="3" fill="#333"/><text x="456" y="118" font-size="11">B</text>
  <circle cx="520" cy="100" r="3" fill="#333"/><text x="526" y="98" font-size="11">C</text>
  <circle cx="552" cy="175" r="3" fill="#333"/><text x="540" y="195" font-size="11">D</text>
  <text x="200" y="210" font-size="12" font-family="Georgia, serif" fill="#555">Fig. 15-1  cup, cap, and changing concavity</text>
</svg>
