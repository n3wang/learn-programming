<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="#fff"/>
  <!-- sphere -->
  <circle cx="160" cy="160" r="120" fill="none" stroke="#222" stroke-width="2"/>
  <!-- cylinder cross-section rectangle -->
  <rect x="88" y="70" width="144" height="180" fill="rgba(70,120,200,0.1)" stroke="#1a4a8a" stroke-width="2"/>
  <!-- center O -->
  <circle cx="160" cy="160" r="3" fill="#222"/>
  <text x="168" y="158" font-size="14" font-family="serif">O</text>
  <!-- radius R to corner -->
  <line x1="160" y1="160" x2="232" y2="70" stroke="#666" stroke-width="1.5"/>
  <text x="200" y="105" font-size="14" font-family="serif">R</text>
  <!-- r horizontal -->
  <line x1="160" y1="160" x2="232" y2="160" stroke="#c45c26" stroke-width="1.5"/>
  <text x="188" y="152" font-size="14" font-family="serif" fill="#c45c26">r</text>
  <!-- h vertical (half-height) -->
  <line x1="160" y1="160" x2="160" y2="70" stroke="#2a7a3a" stroke-width="1.5"/>
  <text x="142" y="115" font-size="14" font-family="serif" fill="#2a7a3a">h</text>
  <!-- right angle mark at O for r-h -->
  <path d="M 150 160 L 150 150 L 160 150" fill="none" stroke="#888" stroke-width="1"/>
  <text x="100" y="300" font-size="12" font-family="serif" fill="#555">r² + h² = R²</text>
</svg>
