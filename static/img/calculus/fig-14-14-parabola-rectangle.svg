<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <rect width="280" height="300" fill="#fff"/>
  <!-- axes -->
  <line x1="36" y1="150" x2="250" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="36" y1="270" x2="36" y2="30" stroke="#333" stroke-width="1.5"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- parabola opening right: x = k y^2 -->
  <path d="M 36 150 Q 90 90, 200 50" fill="none" stroke="#222" stroke-width="2"/>
  <path d="M 36 150 Q 90 210, 200 250" fill="none" stroke="#222" stroke-width="2"/>
  <!-- line x = a -->
  <line x1="200" y1="50" x2="200" y2="250" stroke="#555" stroke-width="1.5"/>
  <!-- inscribed rectangle: left at x, right at a, top/bottom ±y -->
  <rect x="110" y="90" width="90" height="120" fill="rgba(70,120,200,0.12)" stroke="#1a4a8a" stroke-width="2"/>
  <!-- points -->
  <circle cx="110" cy="90" r="3" fill="#1a4a8a"/>
  <circle cx="200" cy="90" r="3" fill="#1a4a8a"/>
  <circle cx="200" cy="210" r="3" fill="#1a4a8a"/>
  <circle cx="110" cy="210" r="3" fill="#1a4a8a"/>
  <text x="92" y="82" font-size="14" font-family="Georgia, serif">P</text>
  <text x="208" y="82" font-size="14" font-family="Georgia, serif">B</text>
  <text x="208" y="228" font-size="14" font-family="Georgia, serif">B?</text>
  <text x="92" y="228" font-size="14" font-family="Georgia, serif">P?</text>
  <text x="140" y="155" font-size="13" font-family="Georgia, serif" fill="#333">a ? x</text>
  <text x="42" y="120" font-size="13" font-family="Georgia, serif">y</text>
  <text x="65" y="145" font-size="12" font-family="Georgia, serif">x</text>
  <text x="188" y="42" font-size="13" font-family="Georgia, serif">x = a</text>
  <text x="248" y="165" font-size="13" font-family="Georgia, serif">x</text>
  <text x="20" y="40" font-size="13" font-family="Georgia, serif">y</text>
  <text x="70" y="55" font-size="12" font-family="Georgia, serif" fill="#555">y² = 4px</text>
</svg>
