<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" width="280" height="360">
  <rect width="280" height="360" fill="#fff"/>
  <!-- wall -->
  <line x1="60" y1="40" x2="60" y2="300" stroke="#333" stroke-width="3"/>
  <!-- mural 12 ft from y=100 to y=220 (scale ~10px/ft): eye at y=280, mural bottom 6ft above = y=220, top 18ft = y=100 -->
  <rect x="52" y="100" width="16" height="120" fill="#c45c26" opacity="0.35" stroke="#c45c26"/>
  <text x="72" y="165" font-size="12">12 ft</text>
  <!-- eye -->
  <circle cx="200" cy="280" r="5" fill="#1565c0"/>
  <text x="208" y="285" font-size="12">eye</text>
  <!-- lines of sight -->
  <line x1="200" y1="280" x2="60" y2="100" stroke="#1a4a8a" stroke-width="1.8"/>
  <line x1="200" y1="280" x2="60" y2="220" stroke="#2e7d32" stroke-width="1.8"/>
  <line x1="200" y1="280" x2="60" y2="280" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="130" y="300" font-size="12">x</text>
  <text x="155" y="250" font-size="13" fill="#2e7d32">φ</text>
  <text x="140" y="200" font-size="13" fill="#1a4a8a">θ</text>
  <text x="68" y="240" font-size="11">6 ft</text>
  <text x="30" y="345" font-size="12" fill="#555" font-family="Georgia, serif">Fig. 18-7 — mural viewing angle θ</text>
</svg>