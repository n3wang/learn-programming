<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340">
  <rect width="420" height="340" fill="#fff"/>
  <!-- axes -->
  <line x1="50" y1="280" x2="390" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="280" x2="50" y2="30" stroke="#333" stroke-width="1.5"/>
  <!-- curve y = x^2/40-ish parabolic -->
  <path d="M 70 250 Q 160 220 200 160 Q 250 90 340 50" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <!-- point P -->
  <circle cx="160" cy="200" r="5" fill="#1565c0"/>
  <text x="130" y="195" font-size="13" fill="#1565c0">P</text>
  <!-- horizontal Delta x -->
  <line x1="160" y1="200" x2="260" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="195" y="215" font-size="12" fill="#555">”x = dx</text>
  <!-- Q on curve -->
  <circle cx="260" cy="120" r="5" fill="#1565c0"/>
  <text x="268" y="115" font-size="13" fill="#1565c0">Q</text>
  <!-- vertical RQ = Delta y -->
  <line x1="260" y1="200" x2="260" y2="120" stroke="#2e7d32" stroke-width="2"/>
  <text x="268" y="165" font-size="12" fill="#2e7d32">”y</text>
  <!-- R at (260,200) -->
  <circle cx="260" cy="200" r="3.5" fill="#888"/>
  <text x="248" y="220" font-size="12" fill="#555">R</text>
  <!-- tangent line through P -->
  <line x1="100" y1="245" x2="310" y2="85" stroke="#c62828" stroke-width="2"/>
  <text x="300" y="75" font-size="13" fill="#c62828"></text>
  <!-- T on tangent at x of R -->
  <circle cx="260" cy="125" r="3.5" fill="#c62828"/>
  <!-- Actually RT should be from R up to tangent - recalculate: tangent from (160,200) with slope -->
  <!-- For clarity: mark T slightly below Q on the red tangent -->
  <line x1="260" y1="200" x2="260" y2="125" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.7"/>
  <text x="230" y="145" font-size="12" fill="#c62828">df = RT</text>
  <text x="55" y="320" font-size="12" fill="#555" font-family="Georgia, serif">Fig. 21-1  differential df H ”y for small ”x</text>
</svg>
