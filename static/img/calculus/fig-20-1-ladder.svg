<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <rect width="360" height="320" fill="#fff"/>
  <!-- wall and ground -->
  <line x1="60" y1="40" x2="60" y2="260" stroke="#333" stroke-width="3"/>
  <line x1="60" y1="260" x2="320" y2="260" stroke="#333" stroke-width="3"/>
  <!-- ladder -->
  <line x1="60" y1="68" x2="220" y2="260" stroke="#1a4a8a" stroke-width="4"/>
  <!-- labels -->
  <text x="130" y="250" font-size="14">x</text>
  <text x="40" y="160" font-size="14">y</text>
  <text x="150" y="150" font-size="13" fill="#c45c26">25 ft</text>
  <polygon points="200,250 220,260 200,255" fill="#2e7d32"/>
  <text x="230" y="255" font-size="12" fill="#2e7d32">dx/dt &gt; 0</text>
  <polygon points="55,100 60,80 65,100" fill="#c62828"/>
  <text x="70" y="95" font-size="12" fill="#c62828">dy/dt &lt; 0</text>
  <text x="40" y="300" font-size="12" fill="#555" font-family="Georgia, serif">Fig. 20-1 — sliding ladder: x² + y² = 625</text>
</svg>