<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>Figure 8.4 — RK2 midpoint slope</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="28" font-size="14" text-anchor="middle" fill="#212121">RK2: Euler half-step to sample the midpoint slope</text>

<!-- axes -->
<line x1="60" y1="290" x2="680" y2="290" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="40" x2="60" y2="290" stroke="#555" stroke-width="1.5"/>
<text x="690" y="294" font-size="12" fill="#555">t</text>
<text x="48" y="38" font-size="12" fill="#555">y</text>

<!-- true curve -->
<path d="M80,250 C200,230 260,90 400,110 C520,130 580,200 650,170"
      fill="none" stroke="#90a4ae" stroke-width="2" stroke-dasharray="5 4"/>
<text x="560" y="150" font-size="11" fill="#78909c">true y(t)</text>

<!-- start point -->
<circle cx="180" cy="220" r="5" fill="#1565c0"/>
<text x="180" y="242" font-size="12" text-anchor="middle" fill="#1565c0">y_n</text>

<!-- Euler half step to midpoint (tentative) -->
<line x1="180" y1="220" x2="280" y2="160" stroke="#c62828" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="280" cy="160" r="4.5" fill="#c62828"/>
<text x="280" y="148" font-size="11" text-anchor="middle" fill="#c62828">y + k/2</text>
<text x="230" y="175" font-size="10" fill="#c62828">k = h f(t,y)</text>

<!-- midpoint slope used for full step -->
<line x1="180" y1="220" x2="380" y2="100" stroke="#2e7d32" stroke-width="2.4"/>
<circle cx="380" cy="100" r="5" fill="#2e7d32"/>
<text x="400" y="98" font-size="12" fill="#2e7d32">y_{n+1} = y_n + k</text>
<text x="280" y="200" font-size="11" fill="#2e7d32">k = h f(t+h/2, y+k/2)</text>

<text x="180" y="312" font-size="12" text-anchor="middle" fill="#616161">t_n</text>
<text x="280" y="312" font-size="12" text-anchor="middle" fill="#616161">t_n+h/2</text>
<text x="380" y="312" font-size="12" text-anchor="middle" fill="#616161">t_n+h</text>

<rect x="450" y="220" width="230" height="58" fill="#fff" stroke="#bdbdbd" rx="4"/>
<text x="462" y="242" font-size="11" fill="#424242">Sample slope at the midpoint,</text>
<text x="462" y="262" font-size="11" fill="#424242">then take one full step with that slope.</text>
</svg>
