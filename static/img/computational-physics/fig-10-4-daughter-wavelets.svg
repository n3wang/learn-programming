<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img">
<title>Figure 10.4 — scaled and translated daughter wavelets</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="480" y="26" font-size="14" text-anchor="middle" fill="#212121">Figure 10.4 — daughters: scale s and translate  of an oscillating Gaussian mother</text>

<!-- s=1, tau=0 -->
<rect x="40" y="50" width="430" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="255" y="72" font-size="12" text-anchor="middle" fill="#1565c0">(s=1, =0) mother scale</text>
<line x1="60" y1="160" x2="450" y2="160" stroke="#bdbdbd"/>
<path d="M100,160 C130,90 160,90 190,160 C220,230 250,230 280,160 C310,90 340,90 370,160 C400,200 420,180 440,160"
      fill="none" stroke="#1565c0" stroke-width="2"/>

<!-- s=1/2, tau=0 -->
<rect x="490" y="50" width="430" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="705" y="72" font-size="12" text-anchor="middle" fill="#c62828">(s=1/2, =0) higher frequency</text>
<line x1="510" y1="160" x2="900" y2="160" stroke="#bdbdbd"/>
<path d="M580,160 C600,80 620,80 640,160 C660,240 680,240 700,160 C720,80 740,80 760,160 C780,220 800,200 820,160"
      fill="none" stroke="#c62828" stroke-width="2"/>

<!-- s=1, tau=6 -->
<rect x="40" y="280" width="430" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="255" y="302" font-size="12" text-anchor="middle" fill="#2e7d32">(s=1, =6) translated</text>
<line x1="60" y1="390" x2="450" y2="390" stroke="#bdbdbd"/>
<path d="M200,390 C230,320 260,320 290,390 C320,460 350,460 380,390 C410,340 430,360 450,390"
      fill="none" stroke="#2e7d32" stroke-width="2"/>

<!-- s=2, tau large -->
<rect x="490" y="280" width="430" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="705" y="302" font-size="12" text-anchor="middle" fill="#6a1b9a">(s=2,  large) lower frequency</text>
<line x1="510" y1="390" x2="900" y2="390" stroke="#bdbdbd"/>
<path d="M540,390 C600,330 660,330 720,390 C780,450 840,450 880,390"
      fill="none" stroke="#6a1b9a" stroke-width="2"/>
</svg>
