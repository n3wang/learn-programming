<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img">
<title>Figure 10.13 — particle beam and four detectors</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="410" y="24" font-size="14" text-anchor="middle" fill="#212121">Figure 10.13 — beam observed by detectors A–D (M-D samples each instant)</text>
<!-- beam -->
<path d="M40,130 L780,130" stroke="#90a4ae" stroke-width="14" opacity="0.35"/>
<path d="M40,130 L780,130" stroke="#546e7a" stroke-width="2" stroke-dasharray="8 6"/>
<text x="60" y="110" font-size="12" fill="#546e7a">beam </text>
<!-- detectors -->
<g fill="#ffe082" stroke="#f9a825" stroke-width="2">
  <rect x="160" y="70" width="70" height="40" rx="4"/>
  <rect x="320" y="160" width="70" height="40" rx="4"/>
  <rect x="480" y="70" width="70" height="40" rx="4"/>
  <rect x="640" y="160" width="70" height="40" rx="4"/>
</g>
<text x="195" y="95" font-size="14" text-anchor="middle">A</text>
<text x="355" y="185" font-size="14" text-anchor="middle">B</text>
<text x="515" y="95" font-size="14" text-anchor="middle">C</text>
<text x="675" y="185" font-size="14" text-anchor="middle">D</text>
<text x="410" y="240" font-size="11" text-anchor="middle" fill="#78909c">each records several observables  one sample vector in R^M</text>
</svg>
