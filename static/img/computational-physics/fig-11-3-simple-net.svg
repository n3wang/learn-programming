<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img">
  <title>Figure 11.3 — shallow network</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="410" y="28" text-anchor="middle" font-size="14" fill="#212121">Figure 11.3 — input  hidden  output (shallow net)</text>
  <!-- input -->
  <circle cx="100" cy="100" r="28" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <circle cx="100" cy="220" r="28" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" font-size="14" fill="#0d47a1">x</text>
  <text x="100" y="225" text-anchor="middle" font-size="14" fill="#0d47a1">x</text>
  <text x="100" y="60" text-anchor="middle" font-size="12" fill="#1565c0">input</text>
  <!-- hidden -->
  <circle cx="400" cy="100" r="32" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <circle cx="400" cy="220" r="32" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-size="14" fill="#e65100">h</text>
  <text x="400" y="225" text-anchor="middle" font-size="14" fill="#e65100">h</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#ef6c00">hidden</text>
  <!-- output -->
  <circle cx="700" cy="160" r="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="700" y="165" text-anchor="middle" font-size="14" fill="#1b5e20">y</text>
  <text x="700" y="110" text-anchor="middle" font-size="12" fill="#2e7d32">output</text>
  <!-- edges -->
  <g stroke="#90a4ae" stroke-width="1.5">
    <line x1="128" y1="100" x2="368" y2="100"/>
    <line x1="128" y1="100" x2="368" y2="220"/>
    <line x1="128" y1="220" x2="368" y2="100"/>
    <line x1="128" y1="220" x2="368" y2="220"/>
    <line x1="432" y1="100" x2="666" y2="160"/>
    <line x1="432" y1="220" x2="666" y2="160"/>
  </g>
  <text x="240" y="85" font-size="11" fill="#c62828">w11, w21</text>
  <text x="540" y="120" font-size="11" fill="#c62828">w1, w2</text>
  <text x="410" y="300" text-anchor="middle" font-size="12" fill="#616161">Each node: weighted sum + bias then activation f</text>
</svg>
