<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
<title>Figure 8.1 — mass–spring with optional external drive</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="28" font-size="14" text-anchor="middle" fill="#212121">driven mass–spring: F_k + F_ext = m x3</text>

<!-- wall -->
<rect x="40" y="80" width="28" height="160" fill="#78909c"/>
<line x1="40" y1="90" x2="28" y2="78" stroke="#546e7a" stroke-width="2"/>
<line x1="40" y1="120" x2="28" y2="108" stroke="#546e7a" stroke-width="2"/>
<line x1="40" y1="150" x2="28" y2="138" stroke="#546e7a" stroke-width="2"/>
<line x1="40" y1="180" x2="28" y2="168" stroke="#546e7a" stroke-width="2"/>
<line x1="40" y1="210" x2="28" y2="198" stroke="#546e7a" stroke-width="2"/>

<!-- spring -->
<path d="M68,160 L95,160 L105,130 L125,190 L145,130 L165,190 L185,130 L205,190 L220,160 L250,160"
      fill="none" stroke="#1565c0" stroke-width="2.4"/>
<text x="155" y="118" font-size="12" fill="#1565c0" text-anchor="middle">spring (F_k)</text>

<!-- mass -->
<rect x="250" y="130" width="70" height="60" rx="4" fill="#ffe082" stroke="#f9a825" stroke-width="2"/>
<text x="285" y="165" font-size="14" text-anchor="middle" fill="#5d4037">m</text>

<!-- x arrow -->
<line x1="285" y1="210" x2="285" y2="210" stroke="none"/>
<path d="M220,250 L380,250" stroke="#424242" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="300" y="272" font-size="12" text-anchor="middle" fill="#424242">x (from equilibrium)</text>

<!-- hand / F_ext -->
<path d="M340,160 L400,160 L410,145 L430,175 L450,145 L470,175 L490,160 L520,160"
      fill="none" stroke="#c62828" stroke-width="2.2"/>
<!-- simple hand silhouette -->
<ellipse cx="545" cy="160" rx="28" ry="22" fill="#ffccbc" stroke="#e64a19" stroke-width="1.5"/>
<path d="M560,148 L590,130 M565,160 L598,155 M560,172 L588,185" stroke="#e64a19" stroke-width="3" stroke-linecap="round"/>
<text x="470" y="118" font-size="12" fill="#c62828" text-anchor="middle">F_ext (hand / drive)</text>

<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#424242"/>
  </marker>
</defs>
</svg>
