<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img">
<title>Figure 10.6 — CWT reconstruction overlaps input</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="450" y="26" font-size="14" text-anchor="middle" fill="#212121">Figure 10.6 — input vs reconstituted signal (overlap; edges softer)</text>
<line x1="50" y1="170" x2="850" y2="170" stroke="#bdbdbd"/>
<!-- input -->
<path d="M50,170 Q100,110 150,170 Q200,230 250,170 Q320,100 400,170 Q480,240 560,170 Q640,90 720,170 Q780,220 850,170"
      fill="none" stroke="#1565c0" stroke-width="2.5"/>
<!-- recon dashed almost same -->
<path d="M50,170 Q100,112 150,170 Q200,228 250,170 Q320,102 400,170 Q480,238 560,170 Q640,92 720,170 Q780,218 850,170"
      fill="none" stroke="#ef6c00" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="200" y="60" font-size="12" fill="#1565c0">input y(t)</text>
<text x="200" y="78" font-size="12" fill="#ef6c00">recon (inverse CWT)</text>
<text x="450" y="300" font-size="11" text-anchor="middle" fill="#78909c">Normalize consistently; expect edge mismatch from finite (s,) grid</text>
</svg>
