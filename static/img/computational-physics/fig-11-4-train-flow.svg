<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" role="img">
  <title>Figure 11.4 — training flowchart</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#212121">Figure 11.4 — train by lowering Loss</text>
  <rect x="140" y="50" width="240" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="260" y="78" text-anchor="middle" font-size="13" fill="#0d47a1">forward: predict y}V~</text>
  <path d="M260 94 L260 118" stroke="#455a64" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="140" y="120" width="240" height="44" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="260" y="148" text-anchor="middle" font-size="13" fill="#e65100">Loss −(y}~, y}V~)</text>
  <path d="M260 164 L260 188" stroke="#455a64" stroke-width="2"/>
  <rect x="140" y="190" width="240" height="44" rx="6" fill="#fce4ec" stroke="#c62828"/>
  <text x="260" y="218" text-anchor="middle" font-size="13" fill="#b71c1c">backprop: −/w, −/b</text>
  <path d="M260 234 L260 258" stroke="#455a64" stroke-width="2"/>
  <rect x="140" y="260" width="240" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="260" y="288" text-anchor="middle" font-size="13" fill="#1b5e20">w  w −  −/w</text>
  <path d="M260 304 L260 328" stroke="#455a64" stroke-width="2"/>
  <rect x="140" y="330" width="240" height="44" rx="6" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="260" y="358" text-anchor="middle" font-size="13" fill="#4a148c">repeat until − small</text>
  <path d="M140 352 L60 352 L60 72 L140 72" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="260" y="420" text-anchor="middle" font-size="12" fill="#616161">Then test on unseen data (true accuracy)</text>
  <text x="260" y="450" text-anchor="middle" font-size="11" fill="#9e9e9e"> = learning rate (SGD)</text>
</svg>
