<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Figure 12.10 — Oracle schematic</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#212121">Figure 12.10 — Oracle O: |k  (−1)^f(k)|k</text>
  <rect x="40" y="60" width="140" height="100" fill="#fff" stroke="#455a64" stroke-width="2" rx="4"/>
  <text x="110" y="100" text-anchor="middle" font-size="13" fill="#212121">|k  O </text>
  <text x="110" y="124" text-anchor="middle" font-size="12" fill="#6a1b9a">(−1)^f(k)|k</text>
  <text x="110" y="175" text-anchor="middle" font-size="11" fill="#616161">schematic</text>
  <rect x="220" y="50" width="180" height="120" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" rx="4"/>
  <text x="310" y="78" text-anchor="middle" font-size="12" fill="#4a148c">i=15 a |1111</text>
  <text x="310" y="108" text-anchor="middle" font-size="11" fill="#6a1b9a">H — CCCZ — H</text>
  <text x="310" y="132" text-anchor="middle" font-size="11" fill="#6a1b9a">(phase kick on all-1)</text>
  <text x="310" y="175" text-anchor="middle" font-size="11" fill="#616161">oracle for |15</text>
  <rect x="440" y="50" width="180" height="120" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="4"/>
  <text x="530" y="78" text-anchor="middle" font-size="12" fill="#0d47a1">i=9 a |1001</text>
  <text x="530" y="108" text-anchor="middle" font-size="11" fill="#1565c0">X on mismatched</text>
  <text x="530" y="132" text-anchor="middle" font-size="11" fill="#1565c0">bits, then CCCZ</text>
  <text x="530" y="175" text-anchor="middle" font-size="11" fill="#616161">oracle for |9</text>
</svg>
