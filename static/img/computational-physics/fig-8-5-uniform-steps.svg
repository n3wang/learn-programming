<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<title>Figure 8.5 — uniform time steps</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="28" font-size="14" text-anchor="middle" fill="#212121">fixed-step ODE march: equal t = h</text>

<!-- time axis -->
<line x1="60" y1="160" x2="680" y2="160" stroke="#555" stroke-width="2"/>
<text x="690" y="164" font-size="12" fill="#555">t</text>

<!-- tick marks at equal spacing -->
<!-- t0..t6 -->
<g fill="#1565c0">
  <line x1="100" y1="150" x2="100" y2="170" stroke="#1565c0" stroke-width="2"/>
  <circle cx="100" cy="160" r="5"/>
  <text x="100" y="192" font-size="12" text-anchor="middle">t</text>

  <line x1="190" y1="150" x2="190" y2="170" stroke="#1565c0" stroke-width="2"/>
  <circle cx="190" cy="160" r="5"/>
  <text x="190" y="192" font-size="12" text-anchor="middle">t</text>

  <line x1="280" y1="150" x2="280" y2="170" stroke="#1565c0" stroke-width="2"/>
  <circle cx="280" cy="160" r="5"/>
  <text x="280" y="192" font-size="12" text-anchor="middle">t</text>

  <line x1="370" y1="150" x2="370" y2="170" stroke="#1565c0" stroke-width="2"/>
  <circle cx="370" cy="160" r="5"/>
  <text x="370" y="192" font-size="12" text-anchor="middle">t</text>

  <line x1="460" y1="150" x2="460" y2="170" stroke="#1565c0" stroke-width="2"/>
  <circle cx="460" cy="160" r="5"/>
  <text x="460" y="192" font-size="12" text-anchor="middle">t</text>

  <line x1="550" y1="150" x2="550" y2="170" stroke="#1565c0" stroke-width="2"/>
  <circle cx="550" cy="160" r="5"/>
  <text x="550" y="192" font-size="12" text-anchor="middle">t</text>

  <line x1="640" y1="150" x2="640" y2="170" stroke="#1565c0" stroke-width="2"/>
  <circle cx="640" cy="160" r="5"/>
  <text x="640" y="192" font-size="12" text-anchor="middle">t</text>
</g>

<!-- h brackets -->
<path d="M100,120 L190,120" stroke="#ef6c00" stroke-width="2" marker-start="url(#tickL)" marker-end="url(#tickR)"/>
<path d="M190,120 L280,120" stroke="#ef6c00" stroke-width="2" marker-start="url(#tickL)" marker-end="url(#tickR)"/>
<path d="M280,120 L370,120" stroke="#ef6c00" stroke-width="2" marker-start="url(#tickL)" marker-end="url(#tickR)"/>
<text x="235" y="108" font-size="13" text-anchor="middle" fill="#ef6c00">h</text>

<!-- y samples above -->
<text x="100" y="70" font-size="11" text-anchor="middle" fill="#424242">y</text>
<text x="190" y="55" font-size="11" text-anchor="middle" fill="#424242">y</text>
<text x="280" y="45" font-size="11" text-anchor="middle" fill="#424242">y</text>
<text x="370" y="50" font-size="11" text-anchor="middle" fill="#424242">y</text>
<circle cx="100" cy="80" r="4" fill="#2e7d32"/>
<circle cx="190" cy="65" r="4" fill="#2e7d32"/>
<circle cx="280" cy="55" r="4" fill="#2e7d32"/>
<circle cx="370" cy="60" r="4" fill="#2e7d32"/>
<circle cx="460" cy="70" r="4" fill="#2e7d32"/>
<circle cx="550" cy="85" r="4" fill="#2e7d32"/>
<circle cx="640" cy="95" r="4" fill="#2e7d32"/>
<path d="M100,80 L190,65 L280,55 L370,60 L460,70 L550,85 L640,95"
      fill="none" stroke="#2e7d32" stroke-width="1.6"/>

<text x="360" y="250" font-size="12" text-anchor="middle" fill="#616161">
  Adaptive RK45 / multistep ABM vary h — sketched later; graded labs use fixed h.
</text>

<defs>
  <marker id="tickL" markerWidth="6" markerHeight="8" refX="0" refY="4" orient="auto">
    <path d="M0,0 L0,8" stroke="#ef6c00" stroke-width="2"/>
  </marker>
  <marker id="tickR" markerWidth="6" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M6,0 L6,8" stroke="#ef6c00" stroke-width="2"/>
  </marker>
</defs>
</svg>
