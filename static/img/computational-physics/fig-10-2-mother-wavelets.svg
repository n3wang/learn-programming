<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img">
<title>Figure 10.2 — four mother wavelets</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="450" y="26" font-size="14" text-anchor="middle" fill="#212121">Figure 10.2 — mother wavelets (scale + translate  daughters)</text>

<!-- Morlet -->
<rect x="40" y="50" width="400" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="240" y="72" font-size="13" text-anchor="middle" fill="#1565c0">Morlet (Re): cos(2t) e^{−t/(2ò)}</text>
<line x1="60" y1="160" x2="420" y2="160" stroke="#bdbdbd"/>
<path d="M80,160 C110,100 140,100 160,160 C180,220 210,220 240,160 C270,100 300,100 320,160 C340,200 360,180 400,160"
      fill="none" stroke="#1565c0" stroke-width="2"/>

<!-- Mexican hat -->
<rect x="460" y="50" width="400" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="660" y="72" font-size="13" text-anchor="middle" fill="#ef6c00">Mexican hat: (1−t/ò) e^{−t/(2ò)}</text>
<line x1="480" y1="160" x2="840" y2="160" stroke="#bdbdbd"/>
<path d="M500,170 C560,200 600,40 660,40 C720,40 760,200 820,170"
      fill="none" stroke="#ef6c00" stroke-width="2"/>

<!-- Haar -->
<rect x="40" y="280" width="400" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="240" y="302" font-size="13" text-anchor="middle" fill="#2e7d32">Haar: up / down step</text>
<line x1="60" y1="390" x2="420" y2="390" stroke="#bdbdbd"/>
<path d="M100,390 L160,390 L160,330 L240,330 L240,450 L320,450 L320,390 L380,390"
      fill="none" stroke="#2e7d32" stroke-width="2.5"/>

<!-- Daub-like fractal sketch -->
<rect x="460" y="280" width="400" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="660" y="302" font-size="13" text-anchor="middle" fill="#6a1b9a">Daubechies-like (sketch)</text>
<line x1="480" y1="390" x2="840" y2="390" stroke="#bdbdbd"/>
<path d="M500,390 L540,340 L580,420 L620,300 L660,430 L700,350 L740,410 L780,370 L820,390"
      fill="none" stroke="#6a1b9a" stroke-width="2"/>
</svg>
