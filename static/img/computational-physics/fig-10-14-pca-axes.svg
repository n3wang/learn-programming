<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img">
<title>Figure 10.14 — PCA axes maximize signal variance</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="460" y="24" font-size="14" text-anchor="middle" fill="#212121">Figure 10.14 — max-variance PC vs secondary PC; right: projected coords</text>

<!-- left scatter -->
<rect x="40" y="50" width="400" height="280" fill="#fff" stroke="#e0e0e0"/>
<text x="240" y="72" font-size="12" text-anchor="middle" fill="#37474f">raw (x,y) samples</text>
<line x1="80" y1="280" x2="400" y2="280" stroke="#bdbdbd"/>
<line x1="80" y1="100" x2="80" y2="280" stroke="#bdbdbd"/>
<!-- cloud along diagonal -->
<g fill="#1565c0">
  <circle cx="140" cy="230" r="4"/><circle cx="160" cy="210" r="4"/>
  <circle cx="180" cy="200" r="4"/><circle cx="200" cy="185" r="4"/>
  <circle cx="220" cy="175" r="4"/><circle cx="240" cy="160" r="4"/>
  <circle cx="260" cy="155" r="4"/><circle cx="280" cy="140" r="4"/>
  <circle cx="300" cy="130" r="4"/><circle cx="320" cy="125" r="4"/>
  <circle cx="150" cy="250" r="3"/><circle cx="270" cy="180" r="3"/>
  <circle cx="310" cy="150" r="3"/><circle cx="190" cy="220" r="3"/>
</g>
<!-- PC axes -->
<line x1="110" y1="250" x2="360" y2="110" stroke="#c62828" stroke-width="2.5"/>
<line x1="200" y1="120" x2="300" y2="260" stroke="#ef6c00" stroke-width="2"/>
<text x="350" y="105" font-size="12" fill="#c62828">PC</text>
<text x="305" y="255" font-size="12" fill="#ef6c00">PC</text>

<!-- right projected -->
<rect x="480" y="50" width="400" height="280" fill="#fff" stroke="#e0e0e0"/>
<text x="680" y="72" font-size="12" text-anchor="middle" fill="#37474f">coords in PC basis</text>
<line x1="520" y1="180" x2="850" y2="180" stroke="#c62828" stroke-width="2"/>
<line x1="680" y1="90" x2="680" y2="270" stroke="#ef6c00" stroke-width="2"/>
<g fill="#1565c0">
  <circle cx="560" cy="175" r="4"/><circle cx="600" cy="185" r="4"/>
  <circle cx="640" cy="170" r="4"/><circle cx="700" cy="190" r="4"/>
  <circle cx="740" cy="165" r="4"/><circle cx="780" cy="180" r="4"/>
  <circle cx="820" cy="175" r="4"/><circle cx="660" cy="200" r="3"/>
  <circle cx="720" cy="160" r="3"/>
</g>
<text x="840" y="170" font-size="12" fill="#c62828">PC</text>
<text x="690" y="100" font-size="12" fill="#ef6c00">PC</text>
</svg>
