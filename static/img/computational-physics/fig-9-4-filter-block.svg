<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img">
<title>Figure 9.4 — filter as convolution</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="28" font-size="14" text-anchor="middle" fill="#212121">Figure 9.4 — input f(t)  filter h  output g = f  h</text>
<rect x="40" y="70" width="140" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="110" y="112" font-size="16" text-anchor="middle" fill="#0d47a1">f(t)</text>
<path d="M190,105 L250,105" stroke="#424242" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="260" y="60" width="160" height="90" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="340" y="100" font-size="15" text-anchor="middle" fill="#e65100">h (impulse response)</text>
<text x="340" y="122" font-size="12" text-anchor="middle" fill="#6d4c41">g = + f() h(t−) d</text>
<path d="M430,105 L490,105" stroke="#424242" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="500" y="70" width="140" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="570" y="112" font-size="16" text-anchor="middle" fill="#1b5e20">g(t)</text>
<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#424242"/>
  </marker>
</defs>
</svg>
