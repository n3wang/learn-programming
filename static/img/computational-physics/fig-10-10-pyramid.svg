<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img">
<title>Figure 10.10 — pyramid down to two smooth + two detail</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="24" font-size="14" text-anchor="middle" fill="#212121">Figure 10.10 — pyramid: filter  2  store details  recurse</text>
<!-- levels -->
<text x="40" y="70" font-size="12" fill="#546e7a">N=1024</text>
<rect x="120" y="50" width="520" height="28" fill="#e3f2fd" stroke="#1565c0"/>
<text x="380" y="69" font-size="12" text-anchor="middle">input samples</text>
<path d="M380,78 L380,100" stroke="#424242"/>
<text x="40" y="130" font-size="12" fill="#546e7a">512+512</text>
<rect x="120" y="110" width="240" height="28" fill="#fff3e0" stroke="#ef6c00"/>
<text x="240" y="129" font-size="12" text-anchor="middle">s}~ smooth</text>
<rect x="400" y="110" width="240" height="28" fill="#fce4ec" stroke="#c62828"/>
<text x="520" y="129" font-size="12" text-anchor="middle">d}~ details (keep)</text>
<path d="M240,138 L240,160" stroke="#424242"/>
<text x="40" y="190" font-size="12" fill="#546e7a">256+256</text>
<rect x="120" y="170" width="180" height="28" fill="#ffe0b2" stroke="#ef6c00"/>
<text x="210" y="189" font-size="12" text-anchor="middle">s}~</text>
<rect x="320" y="170" width="180" height="28" fill="#ffcdd2" stroke="#c62828"/>
<text x="410" y="189" font-size="12" text-anchor="middle">d}~</text>
<path d="M210,198 L210,220" stroke="#424242"/>
<text x="40" y="250" font-size="12" fill="#546e7a">&amp;</text>
<rect x="120" y="230" width="100" height="28" fill="#ffcc80" stroke="#ef6c00"/>
<text x="170" y="249" font-size="12" text-anchor="middle">s</text>
<rect x="240" y="230" width="100" height="28" fill="#ef9a9a" stroke="#c62828"/>
<text x="290" y="249" font-size="12" text-anchor="middle">d</text>
<path d="M170,258 L170,290" stroke="#424242"/>
<text x="40" y="320" font-size="12" fill="#546e7a">2+2</text>
<rect x="120" y="300" width="70" height="28" fill="#ffb74d" stroke="#e65100"/>
<text x="155" y="319" font-size="12" text-anchor="middle">s,s</text>
<rect x="210" y="300" width="70" height="28" fill="#e57373" stroke="#b71c1c"/>
<text x="245" y="319" font-size="12" text-anchor="middle">d,d</text>
<text x="360" y="370" font-size="11" text-anchor="middle" fill="#78909c">Synthesis: reverse arrows — upsample and apply transpose filters</text>
</svg>
