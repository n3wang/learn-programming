<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img">
  <title>Figure 11.9 — k-means clusters of particle masses</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="450" y="28" text-anchor="middle" font-size="14" fill="#212121">Figure 11.9 — k=3 clusters on particle mass (schematic)</text>
  <line x1="60" y1="220" x2="860" y2="220" stroke="#bdbdbd"/>
  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#616161">mass (MeV/c) </text>
  <!-- cluster 0 low -->
  <g fill="#1565c0">
    <circle cx="100" cy="180" r="5"/><circle cx="120" cy="175" r="5"/>
    <circle cx="145" cy="185" r="5"/><circle cx="160" cy="170" r="5"/>
    <circle cx="175" cy="190" r="5"/><circle cx="190" cy="178" r="5"/>
    <circle cx="205" cy="182" r="5"/>
  </g>
  <rect x="148" y="155" width="14" height="14" fill="#0d47a1" transform="rotate(45 155 162)"/>
  <text x="155" y="140" text-anchor="middle" font-size="11" fill="#1565c0">low-mass centroid</text>
  <!-- cluster 1 mid -->
  <g fill="#ef6c00">
    <circle cx="380" cy="175" r="5"/><circle cx="400" cy="185" r="5"/>
    <circle cx="420" cy="170" r="5"/>
  </g>
  <rect x="393" y="150" width="14" height="14" fill="#e65100" transform="rotate(45 400 157)"/>
  <text x="400" y="135" text-anchor="middle" font-size="11" fill="#ef6c00">medium</text>
  <!-- cluster 2 high -->
  <g fill="#2e7d32">
    <circle cx="620" cy="180" r="5"/><circle cx="650" cy="170" r="5"/>
    <circle cx="680" cy="185" r="5"/><circle cx="710" cy="175" r="5"/>
    <circle cx="740" cy="190" r="5"/><circle cx="770" cy="168" r="5"/>
    <circle cx="800" cy="182" r="5"/><circle cx="830" cy="175" r="5"/>
  </g>
  <rect x="713" y="148" width="14" height="14" fill="#1b5e20" transform="rotate(45 720 155)"/>
  <text x="720" y="133" text-anchor="middle" font-size="11" fill="#2e7d32">high-mass centroid </text>
  <text x="450" y="290" text-anchor="middle" font-size="12" fill="#424242">Assign  update means  repeat until centroids stop moving (or max iters)</text>
</svg>
