<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>Figure 8.3 — Euler step lags the true curve</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="28" font-size="14" text-anchor="middle" fill="#212121">Euler: follow the tangent; true solution curves away</text>

<!-- axes -->
<line x1="60" y1="290" x2="680" y2="290" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="40" x2="60" y2="290" stroke="#555" stroke-width="1.5"/>
<text x="690" y="294" font-size="12" fill="#555">t</text>
<text x="48" y="38" font-size="12" fill="#555">y</text>

<!-- true solution curve -->
<path d="M80,240 C180,220 240,80 360,100 C480,120 560,200 640,160"
      fill="none" stroke="#1565c0" stroke-width="2.4"/>
<text x="520" y="140" font-size="12" fill="#1565c0">true y(t)</text>

<!-- Euler chord from tn -->
<line x1="200" y1="200" x2="340" y2="130" stroke="#c62828" stroke-width="2.2"/>
<circle cx="200" cy="200" r="5" fill="#c62828"/>
<circle cx="340" cy="130" r="5" fill="#c62828"/>
<circle cx="340" cy="105" r="5" fill="#1565c0"/>

<!-- vertical error bar -->
<line x1="340" y1="105" x2="340" y2="130" stroke="#ef6c00" stroke-width="2"/>
<text x="352" y="120" font-size="11" fill="#ef6c00">local error ~ O(h)</text>

<text x="200" y="220" font-size="12" text-anchor="middle" fill="#c62828">y_n</text>
<text x="340" y="150" font-size="12" text-anchor="middle" fill="#c62828">y_n + h f</text>
<text x="200" y="312" font-size="12" text-anchor="middle" fill="#616161">t_n</text>
<text x="340" y="312" font-size="12" text-anchor="middle" fill="#616161">t_n+h</text>

<rect x="470" y="200" width="210" height="70" fill="#fff" stroke="#bdbdbd" rx="4"/>
<text x="482" y="222" font-size="11" fill="#424242">y_{n+1} = y_n + h f(t_n, y_n)</text>
<text x="482" y="244" font-size="11" fill="#424242">uses slope only at the left</text>
<text x="482" y="266" font-size="11" fill="#424242">endpoint of the step</text>
</svg>
