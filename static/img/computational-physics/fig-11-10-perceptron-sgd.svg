<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img">
  <title>Figure 11.10 — perceptron / SGD decision regions</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="440" y="26" text-anchor="middle" font-size="14" fill="#212121">Figure 11.10 — supervised class regions (schematic)</text>
  <!-- left panel -->
  <rect x="40" y="50" width="380" height="220" fill="#fff" stroke="#e0e0e0"/>
  <text x="230" y="72" text-anchor="middle" font-size="12" fill="#37474f">Perceptron / linear regions</text>
  <line x1="80" y1="240" x2="380" y2="240" stroke="#bdbdbd"/>
  <line x1="80" y1="90" x2="80" y2="240" stroke="#bdbdbd"/>
  <line x1="100" y1="220" x2="360" y2="100" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="120" y1="200" x2="340" y2="200" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <g fill="#1565c0"><circle cx="140" cy="210" r="4"/><circle cx="180" cy="205" r="4"/></g>
  <g fill="#ef6c00"><circle cx="220" cy="160" r="4"/><circle cx="250" cy="155" r="4"/></g>
  <g fill="#2e7d32"><circle cx="300" cy="120" r="4"/><circle cx="330" cy="115" r="4"/></g>
  <text x="230" y="265" text-anchor="middle" font-size="11" fill="#616161">mass   type / class colors</text>
  <!-- right -->
  <rect x="460" y="50" width="380" height="220" fill="#fff" stroke="#e0e0e0"/>
  <text x="650" y="72" text-anchor="middle" font-size="12" fill="#37474f">SGD hyperplanes</text>
  <line x1="500" y1="240" x2="800" y2="240" stroke="#bdbdbd"/>
  <line x1="500" y1="90" x2="500" y2="240" stroke="#bdbdbd"/>
  <line x1="520" y1="210" x2="780" y2="110" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="530" y1="180" x2="770" y2="180" stroke="#00838f" stroke-width="2" stroke-dasharray="5 3"/>
  <g fill="#7b1fa2"><circle cx="560" cy="200" r="4"/><circle cx="600" cy="190" r="4"/></g>
  <g fill="#00838f"><circle cx="650" cy="150" r="4"/><circle cx="690" cy="145" r="4"/></g>
  <g fill="#c62828"><circle cx="740" cy="120" r="4"/><circle cx="770" cy="115" r="4"/></g>
  <text x="650" y="265" text-anchor="middle" font-size="11" fill="#616161">similar clusters; boundaries not identical</text>
</svg>
