<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img">
<title>Figure 9.5 — RC lowpass and highpass</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="450" y="28" font-size="14" text-anchor="middle" fill="#212121">Figure 9.5 — CR lowpass (left) and highpass (right)</text>

<!-- lowpass: series R, shunt C -->
<text x="220" y="58" font-size="13" text-anchor="middle" fill="#37474f">Lowpass: H=1/(1+i), =RC</text>
<line x1="60" y1="120" x2="120" y2="120" stroke="#424242" stroke-width="2"/>
<rect x="120" y="105" width="70" height="30" fill="#ffe082" stroke="#f9a825"/>
<text x="155" y="125" font-size="14" text-anchor="middle">R</text>
<line x1="190" y1="120" x2="280" y2="120" stroke="#424242" stroke-width="2"/>
<line x1="280" y1="120" x2="280" y2="160" stroke="#424242" stroke-width="2"/>
<!-- capacitor plates -->
<line x1="255" y1="160" x2="305" y2="160" stroke="#1565c0" stroke-width="4"/>
<line x1="255" y1="175" x2="305" y2="175" stroke="#1565c0" stroke-width="4"/>
<text x="320" y="175" font-size="14" fill="#1565c0">C</text>
<line x1="280" y1="175" x2="280" y2="210" stroke="#424242" stroke-width="2"/>
<line x1="60" y1="210" x2="280" y2="210" stroke="#424242" stroke-width="2"/>
<text x="70" y="112" font-size="12" fill="#c62828">in</text>
<text x="250" y="112" font-size="12" fill="#2e7d32">out</text>
<circle cx="250" cy="120" r="4" fill="#2e7d32"/>

<!-- highpass: series C, shunt R -->
<text x="680" y="58" font-size="13" text-anchor="middle" fill="#37474f">Highpass: H=i/(1+i)</text>
<line x1="520" y1="120" x2="560" y2="120" stroke="#424242" stroke-width="2"/>
<line x1="560" y1="105" x2="560" y2="135" stroke="#1565c0" stroke-width="4"/>
<line x1="575" y1="105" x2="575" y2="135" stroke="#1565c0" stroke-width="4"/>
<text x="590" y="100" font-size="14" fill="#1565c0">C</text>
<line x1="575" y1="120" x2="700" y2="120" stroke="#424242" stroke-width="2"/>
<line x1="700" y1="120" x2="700" y2="160" stroke="#424242" stroke-width="2"/>
<rect x="670" y="160" width="60" height="28" fill="#ffe082" stroke="#f9a825"/>
<text x="700" y="179" font-size="14" text-anchor="middle">R</text>
<line x1="700" y1="188" x2="700" y2="210" stroke="#424242" stroke-width="2"/>
<line x1="520" y1="210" x2="700" y2="210" stroke="#424242" stroke-width="2"/>
<text x="530" y="112" font-size="12" fill="#c62828">in</text>
<text x="670" y="112" font-size="12" fill="#2e7d32">out</text>
<circle cx="670" cy="120" r="4" fill="#2e7d32"/>

<text x="450" y="255" font-size="12" text-anchor="middle" fill="#78909c">=RC; |H_lp| falls with ; |H_hp|1 at high </text>
</svg>
