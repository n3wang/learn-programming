<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img">
<title>Figure 9.1 — sawtooth signal and Fourier |b| spectrum</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="520" y="28" font-size="15" text-anchor="middle" fill="#212121">Figure 9.1 — periodic sawtooth and its sine-spectrum amplitudes</text>

<!-- Left panel: sawtooth -->
<text x="260" y="58" font-size="13" text-anchor="middle" fill="#37474f">Left: sawtooth y(t) over two periods</text>
<line x1="60" y1="240" x2="460" y2="240" stroke="#90a4ae" stroke-width="1.5"/>
<line x1="60" y1="90" x2="60" y2="340" stroke="#90a4ae" stroke-width="1.5"/>
<text x="470" y="244" font-size="12" fill="#546e7a">t</text>
<text x="48" y="95" font-size="12" fill="#546e7a">y</text>

<!-- period marks -->
<line x1="160" y1="235" x2="160" y2="245" stroke="#78909c"/>
<line x1="260" y1="235" x2="260" y2="245" stroke="#78909c"/>
<line x1="360" y1="235" x2="360" y2="245" stroke="#78909c"/>
<text x="160" y="262" font-size="11" text-anchor="middle" fill="#607d8b">T/2</text>
<text x="260" y="262" font-size="11" text-anchor="middle" fill="#607d8b">T</text>
<text x="360" y="262" font-size="11" text-anchor="middle" fill="#607d8b">3T/2</text>

<!-- sawtooth path: 01 on [0,T/2], 1−1 jump conceptually as ramp from -1 at T/2+ to 0 at T, then repeat -->
<!-- Using odd form y = 2t/T on (-T/2,T/2), periodic: rise through 0 -->
<path d="M60,240 L160,140 L160,340 L260,240 L360,140 L360,340 L460,240"
      fill="none" stroke="#1565c0" stroke-width="2.6"/>
<text x="260" y="320" font-size="12" text-anchor="middle" fill="#1565c0">odd ramp; jumps at half-periods</text>
<text x="160" y="130" font-size="11" text-anchor="middle" fill="#c62828">discontinuity</text>
<text x="360" y="130" font-size="11" text-anchor="middle" fill="#c62828">discontinuity</text>

<!-- Right panel: spectrum sticks -->
<text x="780" y="58" font-size="13" text-anchor="middle" fill="#37474f">Right: |b|  1/n for the sine series</text>
<line x1="560" y1="320" x2="1000" y2="320" stroke="#90a4ae" stroke-width="1.5"/>
<line x1="560" y1="90" x2="560" y2="320" stroke="#90a4ae" stroke-width="1.5"/>
<text x="1010" y="324" font-size="12" fill="#546e7a">n</text>
<text x="548" y="95" font-size="12" fill="#546e7a">|b|</text>

<!-- bars for n=1..8 heights ~ 1/n scaled -->
<!-- max height ~ 200 for n=1 -->
<rect x="590" y="120" width="28" height="200" fill="#ef6c00"/>
<rect x="640" y="220" width="28" height="100" fill="#ef6c00"/>
<rect x="690" y="253" width="28" height="67" fill="#ef6c00"/>
<rect x="740" y="270" width="28" height="50" fill="#ef6c00"/>
<rect x="790" y="280" width="28" height="40" fill="#ef6c00"/>
<rect x="840" y="287" width="28" height="33" fill="#ef6c00"/>
<rect x="890" y="291" width="28" height="29" fill="#ef6c00"/>
<rect x="940" y="295" width="28" height="25" fill="#ef6c00"/>

<text x="604" y="340" font-size="11" text-anchor="middle" fill="#5d4037">1</text>
<text x="654" y="340" font-size="11" text-anchor="middle" fill="#5d4037">2</text>
<text x="704" y="340" font-size="11" text-anchor="middle" fill="#5d4037">3</text>
<text x="754" y="340" font-size="11" text-anchor="middle" fill="#5d4037">4</text>
<text x="804" y="340" font-size="11" text-anchor="middle" fill="#5d4037">5</text>
<text x="854" y="340" font-size="11" text-anchor="middle" fill="#5d4037">6</text>
<text x="904" y="340" font-size="11" text-anchor="middle" fill="#5d4037">7</text>
<text x="954" y="340" font-size="11" text-anchor="middle" fill="#5d4037">8</text>

<text x="780" y="375" font-size="12" text-anchor="middle" fill="#6d4c41">b = 2(−1)^{n+1}/(n) — power ~ a+b</text>
<text x="780" y="398" font-size="11" text-anchor="middle" fill="#78909c">Signs alternate; magnitude falls as 1/n</text>
</svg>
