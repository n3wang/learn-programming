<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>Figure 6.2 — Newton–Raphson (tangent intercept)</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="28" font-size="14" text-anchor="middle" fill="#212121">Newton–Raphson: new guess = zero of the tangent at the old guess</text>

<line x1="50" y1="280" x2="690" y2="280" stroke="#555" stroke-width="1.5"/>
<line x1="50" y1="50" x2="50" y2="280" stroke="#555" stroke-width="1.5"/>
<text x="700" y="284" font-size="12" fill="#555">x</text>
<text x="38" y="48" font-size="12" fill="#555">f</text>
<line x1="50" y1="170" x2="690" y2="170" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
<text x="56" y="164" font-size="11" fill="#757575">0</text>

<!-- curved f -->
<path d="M70,70 C150,50 220,260 320,250 C420,240 480,80 580,90 C640,96 680,200 700,240"
      fill="none" stroke="#455a64" stroke-width="2.2"/>

<!-- first guess x0 -->
<line x1="200" y1="280" x2="200" y2="95" stroke="#c62828" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="200" cy="95" r="4.5" fill="#c62828"/>
<text x="200" y="302" font-size="12" text-anchor="middle" fill="#c62828">x0</text>
<text x="208" y="88" font-size="11" fill="#c62828">f(x0)</text>

<!-- tangent from (200,95) with slope ~ -0.55 (screen) toward axis at ~390 -->
<line x1="120" y1="50" x2="420" y2="280" stroke="#1565c0" stroke-width="2"/>
<circle cx="390" cy="280" r="4.5" fill="#1565c0"/>
<text x="390" y="318" font-size="12" text-anchor="middle" fill="#1565c0">x1 = x0 + x</text>
<text x="280" y="140" font-size="11" fill="#1565c0">tangent</text>

<!-- second guess and next tangent -->
<line x1="390" y1="280" x2="390" y2="210" stroke="#2e7d32" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="390" cy="210" r="4" fill="#2e7d32"/>
<line x1="330" y1="250" x2="480" y2="150" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5 3"/>
<circle cx="455" cy="280" r="4" fill="#2e7d32"/>
<text x="455" y="302" font-size="11" text-anchor="middle" fill="#2e7d32">x2</text>

<rect x="500" y="48" width="200" height="78" fill="#fff" stroke="#bdbdbd" rx="4"/>
<text x="512" y="70" font-size="11" fill="#424242">x = −f(x0) / f2(x0)</text>
<text x="512" y="90" font-size="11" fill="#424242">Repeat at the new x</text>
<text x="512" y="110" font-size="11" fill="#424242">Fast near a root (H linear)</text>
</svg>
