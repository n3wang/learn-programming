<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
<title>Figure 9.8 — FFT butterfly</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="28" font-size="14" text-anchor="middle" fill="#212121">Figure 9.8 — butterfly: (y_p, y_q)  (y_p+Z y_q, y_p−Z y_q)</text>

<circle cx="120" cy="90" r="28" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="120" y="96" font-size="16" text-anchor="middle" fill="#0d47a1">y_p</text>
<circle cx="120" cy="200" r="28" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="120" y="206" font-size="16" text-anchor="middle" fill="#0d47a1">y_q</text>

<path d="M160,90 L320,90" stroke="#424242" stroke-width="2"/>
<path d="M160,200 L320,200" stroke="#424242" stroke-width="2"/>
<path d="M160,90 L320,200" stroke="#ef6c00" stroke-width="2"/>
<path d="M160,200 L320,90" stroke="#ef6c00" stroke-width="2"/>
<text x="230" y="70" font-size="12" fill="#6d4c41">Z on lower wing</text>

<circle cx="400" cy="90" r="36" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="400" y="86" font-size="13" text-anchor="middle" fill="#1b5e20">y_p+Z y_q</text>
<text x="400" y="104" font-size="11" text-anchor="middle" fill="#558b2f">upper</text>
<circle cx="400" cy="200" r="36" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
<text x="400" y="196" font-size="13" text-anchor="middle" fill="#b71c1c">y_p−Z y_q</text>
<text x="400" y="214" font-size="11" text-anchor="middle" fill="#e57373">lower</text>

<text x="560" y="140" font-size="12" fill="#546e7a">Reuse Z powers;</text>
<text x="560" y="160" font-size="12" fill="#546e7a">halve work each stage</text>
<text x="560" y="180" font-size="12" fill="#546e7a"> ~ N log N</text>
</svg>
