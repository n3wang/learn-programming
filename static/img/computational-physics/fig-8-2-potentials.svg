<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>Figure 8.2 — harmonic vs anharmonic potentials</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="26" font-size="14" text-anchor="middle" fill="#212121">V(x): harmonic, soft anharmonic, and |x|^p wells</text>

<!-- left panel axes -->
<line x1="50" y1="280" x2="340" y2="280" stroke="#555" stroke-width="1.5"/>
<line x1="195" y1="50" x2="195" y2="280" stroke="#555" stroke-width="1.5"/>
<text x="348" y="284" font-size="12" fill="#555">x</text>
<text x="180" y="48" font-size="12" fill="#555">V</text>

<!-- harmonic parabola -->
<path d="M70,260 Q195,40 320,260" fill="none" stroke="#1565c0" stroke-width="2.2"/>
<text x="100" y="90" font-size="11" fill="#1565c0"> k x</text>

<!-- soft anharmonic (tilted/flatter for large +x) -->
<path d="M70,255 Q150,70 230,120 Q280,160 330,200" fill="none" stroke="#c62828" stroke-width="2.2"/>
<text x="250" y="100" font-size="11" fill="#c62828">kx(1−Tx)</text>
<text x="195" y="310" font-size="11" text-anchor="middle" fill="#616161">left: harmonic vs soft cubic correction</text>

<!-- right panel axes -->
<line x1="400" y1="280" x2="690" y2="280" stroke="#555" stroke-width="1.5"/>
<line x1="545" y1="50" x2="545" y2="280" stroke="#555" stroke-width="1.5"/>
<text x="698" y="284" font-size="12" fill="#555">x</text>
<text x="530" y="48" font-size="12" fill="#555">V</text>

<!-- p=2 -->
<path d="M420,260 Q545,80 670,260" fill="none" stroke="#1565c0" stroke-width="2"/>
<!-- p=4 steeper walls -->
<path d="M455,260 Q545,40 635,260" fill="none" stroke="#2e7d32" stroke-width="2"/>
<!-- p=6 even steeper -->
<path d="M480,260 Q545,30 610,260" fill="none" stroke="#6a1b9a" stroke-width="2"/>
<text x="620" y="70" font-size="11" fill="#1565c0">p=2</text>
<text x="620" y="90" font-size="11" fill="#2e7d32">p=4</text>
<text x="620" y="110" font-size="11" fill="#6a1b9a">p=6</text>
<text x="545" y="310" font-size="11" text-anchor="middle" fill="#616161">right: V = k|x|^p / p (even p)</text>
</svg>
