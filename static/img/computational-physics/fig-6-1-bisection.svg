<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img">
<title>Figure 6.1 — bisection (interval halving)</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="360" y="28" font-size="14" text-anchor="middle" fill="#212121">bisection: keep the half that still brackets a root</text>

<!-- axes -->
<line x1="60" y1="280" x2="680" y2="280" stroke="#555" stroke-width="1.5"/>
<line x1="60" y1="60" x2="60" y2="280" stroke="#555" stroke-width="1.5"/>
<text x="690" y="284" font-size="12" fill="#555">x</text>
<text x="48" y="58" font-size="12" fill="#555">f</text>
<line x1="60" y1="170" x2="680" y2="170" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
<text x="66" y="164" font-size="11" fill="#757575">0</text>

<!-- smooth curve crossing zero -->
<path d="M80,90 C160,70 220,250 300,230 C380,210 430,90 520,100 C580,106 620,200 660,240"
      fill="none" stroke="#455a64" stroke-width="2.2"/>

<!-- interval: [x-, x+] -->
<line x1="160" y1="280" x2="160" y2="88" stroke="#c62828" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="560" y1="280" x2="560" y2="112" stroke="#c62828" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="160" cy="88" r="4" fill="#c62828"/>
<circle cx="560" cy="112" r="4" fill="#c62828"/>
<text x="160" y="302" font-size="12" text-anchor="middle" fill="#c62828">x-</text>
<text x="560" y="302" font-size="12" text-anchor="middle" fill="#c62828">x+</text>
<text x="148" y="78" font-size="11" fill="#c62828">f- &lt; 0</text>
<text x="548" y="102" font-size="11" fill="#c62828">f+ &gt; 0</text>

<!-- midpoint -->
<line x1="360" y1="280" x2="360" y2="170" stroke="#1565c0" stroke-width="2"/>
<circle cx="360" cy="214" r="4.5" fill="#1565c0"/>
<text x="360" y="318" font-size="12" text-anchor="middle" fill="#1565c0">x = (x- + x+)/2</text>
<text x="372" y="210" font-size="11" fill="#1565c0">f(x)</text>

<!-- arrows showing which half is kept -->
<path d="M200,250 L340,250" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M380,250 L520,250" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5 4"/>
<text x="270" y="242" font-size="11" text-anchor="middle" fill="#2e7d32">keep if f-·f(x) &lt; 0</text>
<text x="450" y="242" font-size="11" text-anchor="middle" fill="#9e9e9e">discard</text>

<!-- legend box -->
<rect x="470" y="48" width="200" height="72" fill="#fff" stroke="#bdbdbd" rx="4"/>
<text x="482" y="70" font-size="11" fill="#424242">Each step: width halves</text>
<text x="482" y="90" font-size="11" fill="#424242">Need f(x-)·f(x+) &lt; 0</text>
<text x="482" y="110" font-size="11" fill="#424242">Stop when |x+ − x-| &lt; ε</text>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#2e7d32"/>
  </marker>
</defs>
</svg>
