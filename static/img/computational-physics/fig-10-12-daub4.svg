<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img">
<title>Figure 10.12 — Daub4 wavelet shapes (schematic)</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="450" y="24" font-size="14" text-anchor="middle" fill="#212121">Figure 10.12 — Daub4 wavelets via inverse filter (schematic)</text>
<rect x="40" y="50" width="400" height="200" fill="#fff" stroke="#e0e0e0"/>
<text x="240" y="72" font-size="12" text-anchor="middle" fill="#6a1b9a">single coefficient  one Daub4 packet</text>
