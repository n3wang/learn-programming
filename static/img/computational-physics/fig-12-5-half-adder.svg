<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img">
  <title>Half-adder: Toffoli then CNOT</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="210" y="24" text-anchor="middle" font-size="13" fill="#212121">Half-adder: Toffoli (carry) then CNOT (sum)</text>
  <line x1="40" y1="60" x2="380" y2="60" stroke="#455a64" stroke-width="2"/>
  <line x1="40" y1="110" x2="380" y2="110" stroke="#455a64" stroke-width="2"/>
  <line x1="40" y1="160" x2="380" y2="160" stroke="#455a64" stroke-width="2"/>
  <text x="48" y="50" font-size="11" fill="#1565c0">q0</text>
  <text x="48" y="100" font-size="11" fill="#1565c0">q1</text>
  <text x="48" y="150" font-size="11" fill="#1565c0">q2 carry</text>
  <circle cx="160" cy="60" r="7" fill="none" stroke="#6a1b9a" stroke-width="2"/>
  <circle cx="160" cy="110" r="7" fill="none" stroke="#6a1b9a" stroke-width="2"/>
  <line x1="160" y1="67" x2="160" y2="160" stroke="#6a1b9a" stroke-width="2"/>
  <circle cx="160" cy="160" r="12" fill="none" stroke="#6a1b9a" stroke-width="2"/>
  <line x1="154" y1="160" x2="166" y2="160" stroke="#6a1b9a" stroke-width="2"/>
  <line x1="160" y1="154" x2="160" y2="166" stroke="#6a1b9a" stroke-width="2"/>
  <text x="175" y="90" font-size="11" fill="#6a1b9a">Toffoli</text>
  <circle cx="280" cy="60" r="7" fill="none" stroke="#ef6c00" stroke-width="2"/>
  <line x1="280" y1="67" x2="280" y2="110" stroke="#ef6c00" stroke-width="2"/>
  <circle cx="280" cy="110" r="12" fill="none" stroke="#ef6c00" stroke-width="2"/>
  <line x1="274" y1="110" x2="286" y2="110" stroke="#ef6c00" stroke-width="2"/>
  <line x1="280" y1="104" x2="280" y2="116" stroke="#ef6c00" stroke-width="2"/>
  <text x="295" y="90" font-size="11" fill="#ef6c00">CNOT</text>
</svg>
