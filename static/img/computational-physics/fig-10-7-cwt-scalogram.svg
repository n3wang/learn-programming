<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img">
<title>Figure 10.7 — CWT scalogram of staged multi-tone</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="450" y="26" font-size="14" text-anchor="middle" fill="#212121">Figure 10.7 — |Y(s,)| idea: more high- (small s) bands appear later</text>
<line x1="80" y1="300" x2="860" y2="300" stroke="#90a4ae"/>
<line x1="80" y1="50" x2="80" y2="300" stroke="#90a4ae"/>
<text x="870" y="304" font-size="12" fill="#546e7a"></text>
<text x="40" y="180" font-size="12" fill="#546e7a" transform="rotate(-90 40,180)">small s </text>

<!-- early: one band mid -->
<rect x="120" y="160" width="160" height="40" fill="#bbdefb" opacity="0.9"/>
<!-- mid: two bands -->
<rect x="320" y="160" width="200" height="36" fill="#90caf9" opacity="0.9"/>
<rect x="320" y="100" width="200" height="28" fill="#42a5f5" opacity="0.85"/>
<!-- late: three bands -->
<rect x="560" y="160" width="220" height="36" fill="#64b5f6" opacity="0.9"/>
<rect x="560" y="100" width="220" height="28" fill="#1e88e5" opacity="0.85"/>
<rect x="560" y="55" width="220" height="24" fill="#0d47a1" opacity="0.8"/>

<text x="200" y="320" font-size="11" text-anchor="middle" fill="#546e7a">early </text>
<text x="420" y="320" font-size="11" text-anchor="middle" fill="#546e7a">mid </text>
<text x="670" y="320" font-size="11" text-anchor="middle" fill="#546e7a">late </text>
<text x="450" y="350" font-size="11" text-anchor="middle" fill="#78909c">Matches staged signal (10.1): 1  2  3 tones</text>
</svg>
