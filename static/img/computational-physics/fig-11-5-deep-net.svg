<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img">
  <title>Figure 11.5 — hierarchical deep net on a 22 patch</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="460" y="28" text-anchor="middle" font-size="14" fill="#212121">Figure 11.5 — hierarchical line classifier (schematic)</text>

  <!-- input 2x2 -->
  <text x="90" y="60" font-size="12" fill="#1565c0">input pixels</text>
  <rect x="40" y="70" width="40" height="40" fill="#212121" stroke="#424242"/>
  <rect x="80" y="70" width="40" height="40" fill="#212121" stroke="#424242"/>
  <rect x="40" y="110" width="40" height="40" fill="#eeeeee" stroke="#424242"/>
  <rect x="80" y="110" width="40" height="40" fill="#eeeeee" stroke="#424242"/>
  <text x="80" y="175" text-anchor="middle" font-size="11" fill="#616161">horizontal top</text>

  <!-- layers -->
  <g font-size="11" fill="#37474f">
    <text x="220" y="55">input</text>
    <circle cx="220" cy="90" r="14" fill="#e3f2fd" stroke="#1565c0"/>
    <circle cx="220" cy="130" r="14" fill="#e3f2fd" stroke="#1565c0"/>
    <circle cx="220" cy="170" r="14" fill="#e3f2fd" stroke="#1565c0"/>
    <circle cx="220" cy="210" r="14" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="220" y="94" text-anchor="middle" font-size="9">TL</text>
    <text x="220" y="134" text-anchor="middle" font-size="9">TR</text>
    <text x="220" y="174" text-anchor="middle" font-size="9">BL</text>
    <text x="220" y="214" text-anchor="middle" font-size="9">BR</text>

    <text x="380" y="55">hidden 1</text>
    <text x="380" y="40" font-size="10" fill="#ef6c00">pixels  pairs</text>
    <circle cx="380" cy="100" r="16" fill="#fff3e0" stroke="#ef6c00"/>
    <circle cx="380" cy="150" r="16" fill="#fff3e0" stroke="#ef6c00"/>
    <circle cx="380" cy="200" r="16" fill="#fff3e0" stroke="#ef6c00"/>
    <circle cx="380" cy="250" r="16" fill="#fff3e0" stroke="#ef6c00"/>

    <text x="540" y="55">hidden 2</text>
    <text x="540" y="40" font-size="10" fill="#6a1b9a">pairs  lines</text>
    <circle cx="540" cy="120" r="18" fill="#f3e5f5" stroke="#6a1b9a"/>
    <circle cx="540" cy="190" r="18" fill="#f3e5f5" stroke="#6a1b9a"/>
    <circle cx="540" cy="260" r="18" fill="#f3e5f5" stroke="#6a1b9a"/>

    <text x="700" y="55">hidden 3</text>
    <text x="700" y="40" font-size="10" fill="#c62828">ReLU</text>
    <circle cx="700" cy="140" r="18" fill="#ffebee" stroke="#c62828"/>
    <circle cx="700" cy="220" r="18" fill="#ffebee" stroke="#c62828"/>

    <text x="840" y="55">out</text>
    <circle cx="840" cy="180" r="22" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="840" y="184" text-anchor="middle" font-size="10" fill="#1b5e20">class</text>
  </g>

  <g stroke="#90a4ae" stroke-width="1">
    <line x1="234" y1="90" x2="364" y2="100"/>
    <line x1="234" y1="210" x2="364" y2="100"/>
    <line x1="396" y1="100" x2="522" y2="120"/>
    <line x1="396" y1="150" x2="522" y2="120"/>
    <line x1="558" y1="120" x2="682" y2="140"/>
    <line x1="558" y1="190" x2="682" y2="140"/>
    <line x1="718" y1="140" x2="818" y2="180"/>
    <line x1="718" y1="220" x2="818" y2="180"/>
  </g>

  <text x="460" y="320" text-anchor="middle" font-size="12" fill="#424242">Example: vertical probe at h uses edges from TL &amp; BL  (−1)(1)+(1)(1)=0 (no vertical in this input)</text>
  <text x="460" y="350" text-anchor="middle" font-size="12" fill="#616161">Later layers combine pair detectors into line orientations; ReLU keeps positive evidence</text>
  <text x="460" y="390" text-anchor="middle" font-size="11" fill="#9e9e9e">No same-layer edges; no skip to non-adjacent layers (this didactic net)</text>
</svg>
