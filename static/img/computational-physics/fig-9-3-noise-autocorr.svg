<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img">
<title>Figure 9.3 — noise, autocorrelation, power spectrum, lowpass idea</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="520" y="26" font-size="14" text-anchor="middle" fill="#212121">Figure 9.3 — noisy signal  autocorrelation  power spectrum  filtered idea</text>

<!-- panel 1: noisy signal -->
<rect x="40" y="50" width="460" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="270" y="72" font-size="12" text-anchor="middle" fill="#37474f">y(t)=s(t)+n(t)</text>
<polyline points="60,160 80,120 100,180 120,100 140,190 160,110 180,170 200,130 220,175 240,125 260,165 280,140 300,155 320,145 340,160 360,150 380,158 400,152 420,156 440,154 460,155"
          fill="none" stroke="#c62828" stroke-width="1.5"/>
<path d="M60,155 Q150,100 270,155 T480,155" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4 3"/>
<text x="270" y="248" font-size="11" text-anchor="middle" fill="#78909c">dashed: smooth s(t); red: noise riding on it</text>

<!-- panel 2: autocorrelation -->
<rect x="540" y="50" width="460" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="770" y="72" font-size="12" text-anchor="middle" fill="#37474f">A() autocorrelation</text>
<path d="M560,200 C620,80 700,90 770,200 C840,310 900,280 980,200" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<line x1="560" y1="200" x2="980" y2="200" stroke="#bdbdbd"/>
<text x="770" y="248" font-size="11" text-anchor="middle" fill="#78909c">noise averages down; lag peak tracks s</text>

<!-- panel 3: power spectrum -->
<rect x="40" y="280" width="460" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="270" y="302" font-size="12" text-anchor="middle" fill="#37474f">power ~ |S()| from A()</text>
<line x1="70" y1="450" x2="460" y2="450" stroke="#bdbdbd"/>
<rect x="140" y="340" width="22" height="110" fill="#ef6c00"/>
<rect x="220" y="380" width="22" height="70" fill="#ef6c00"/>
<rect x="300" y="410" width="22" height="40" fill="#ef6c00"/>
<text x="270" y="478" font-size="11" text-anchor="middle" fill="#78909c">broadband noise floor suppressed</text>

<!-- panel 4: filtered -->
<rect x="540" y="280" width="460" height="210" fill="#fff" stroke="#e0e0e0"/>
<text x="770" y="302" font-size="12" text-anchor="middle" fill="#37474f">after low-pass idea (preview)</text>
<path d="M560,400 Q650,340 770,390 T980,385" fill="none" stroke="#6a1b9a" stroke-width="2.4"/>
<text x="770" y="478" font-size="11" text-anchor="middle" fill="#78909c">high- cut; smoother reconstruction</text>
</svg>
