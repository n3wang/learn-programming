<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img">
  <title>Figure 11.7 — binding energy per nucleon vs A</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="440" y="28" text-anchor="middle" font-size="14" fill="#212121">Figure 11.7 — H-isotope B/A vs A (schematic)</text>
  <line x1="60" y1="250" x2="420" y2="250" stroke="#bdbdbd"/>
  <line x1="60" y1="50" x2="60" y2="250" stroke="#bdbdbd"/>
  <text x="240" y="280" text-anchor="middle" font-size="12" fill="#616161">A</text>
  <text x="30" y="150" font-size="12" fill="#616161" transform="rotate(-90 30 150)">B/A</text>
  <polyline fill="none" stroke="#1565c0" stroke-width="2"
    points="90,240 140,160 190,80 240,120 290,145 340,175 390,155"/>
  <g fill="#c62828">
    <circle cx="90" cy="240" r="4"/><circle cx="140" cy="160" r="4"/>
    <circle cx="190" cy="80" r="4"/><circle cx="240" cy="120" r="4"/>
    <circle cx="290" cy="145" r="4"/><circle cx="340" cy="175" r="4"/>
    <circle cx="390" cy="155" r="4"/>
  </g>
  <text x="100" y="70" font-size="12" fill="#1565c0">points = isotope table</text>
  <text x="100" y="90" font-size="12" fill="#ef6c00">curve = poly / linear fit (sklearn-style)</text>

  <line x1="500" y1="250" x2="840" y2="250" stroke="#bdbdbd"/>
  <line x1="500" y1="50" x2="500" y2="250" stroke="#bdbdbd"/>
  <text x="670" y="280" text-anchor="middle" font-size="12" fill="#616161">r (Mpc)</text>
  <text x="470" y="150" font-size="12" fill="#616161" transform="rotate(-90 470 150)">v</text>
  <line x1="520" y1="220" x2="820" y2="70" stroke="#2e7d32" stroke-width="2"/>
  <g fill="#1565c0">
    <circle cx="560" cy="200" r="4"/><circle cx="620" cy="170" r="4"/>
    <circle cx="680" cy="140" r="4"/><circle cx="740" cy="110" r="4"/>
    <circle cx="800" cy="85" r="4"/>
  </g>
  <text x="670" y="45" text-anchor="middle" font-size="12" fill="#2e7d32">Hubble: minimize MSE for v H H r + b</text>
</svg>
