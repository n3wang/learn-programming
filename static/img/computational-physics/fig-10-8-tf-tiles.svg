<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img">
<title>Figure 10.8 — equal-area time–frequency tiles</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="210" y="24" font-size="13" text-anchor="middle" fill="#212121">Figure 10.8 — tiles with  t H 2</text>
<line x1="60" y1="360" x2="380" y2="360" stroke="#90a4ae"/>
<line x1="60" y1="40" x2="60" y2="360" stroke="#90a4ae"/>
<text x="390" y="364" font-size="12" fill="#546e7a">t</text>
<text x="40" y="50" font-size="12" fill="#546e7a"></text>
<!-- low freq: wide, short -->
<rect x="80" y="280" width="120" height="50" fill="#bbdefb" stroke="#1565c0"/>
<rect x="220" y="280" width="120" height="50" fill="#bbdefb" stroke="#1565c0"/>
<!-- mid -->
<rect x="80" y="180" width="60" height="80" fill="#90caf9" stroke="#1565c0"/>
<rect x="150" y="180" width="60" height="80" fill="#90caf9" stroke="#1565c0"/>
<rect x="220" y="180" width="60" height="80" fill="#90caf9" stroke="#1565c0"/>
<rect x="290" y="180" width="60" height="80" fill="#90caf9" stroke="#1565c0"/>
<!-- high: narrow, tall -->
<rect x="80" y="60" width="30" height="100" fill="#42a5f5" stroke="#0d47a1"/>
<rect x="120" y="60" width="30" height="100" fill="#42a5f5" stroke="#0d47a1"/>
<rect x="160" y="60" width="30" height="100" fill="#42a5f5" stroke="#0d47a1"/>
<rect x="200" y="60" width="30" height="100" fill="#42a5f5" stroke="#0d47a1"/>
<rect x="240" y="60" width="30" height="100" fill="#42a5f5" stroke="#0d47a1"/>
<rect x="280" y="60" width="30" height="100" fill="#42a5f5" stroke="#0d47a1"/>
<rect x="320" y="60" width="30" height="100" fill="#42a5f5" stroke="#0d47a1"/>
<text x="210" y="400" font-size="11" text-anchor="middle" fill="#78909c">high   taller/narrower boxes (same area)</text>
</svg>
