<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img">
  <title>Figure 11.12–13 — ripe fruit and RGB histograms</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" fill="#212121">Figures 11.12–13 — ripeness via RGB histograms (schematic)</text>
  <!-- berries -->
  <ellipse cx="120" cy="120" rx="50" ry="40" fill="#c62828" stroke="#8e0000"/>
  <ellipse cx="200" cy="130" rx="40" ry="32" fill="#e53935" stroke="#8e0000"/>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#c62828">ripe (red-heavy)</text>
  <ellipse cx="320" cy="120" rx="50" ry="40" fill="#81c784" stroke="#2e7d32"/>
  <ellipse cx="400" cy="130" rx="40" ry="32" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#2e7d32">unripe (green-heavy)</text>
  <!-- hist ripe -->
  <rect x="480" y="50" width="180" height="140" fill="#fff" stroke="#e0e0e0"/>
  <text x="570" y="68" text-anchor="middle" font-size="11" fill="#37474f">ripe RGB hist</text>
  <polyline fill="none" stroke="#1565c0" stroke-width="1.5" points="500,170 520,160 540,150 560,140 580,90 600,100 620,130 640,160"/>
  <polyline fill="none" stroke="#2e7d32" stroke-width="1.5" points="500,165 530,155 560,145 590,140 620,150 640,165"/>
  <polyline fill="none" stroke="#c62828" stroke-width="2" points="500,160 530,140 560,100 590,70 620,85 640,120"/>
  <!-- hist unripe -->
  <rect x="690" y="50" width="180" height="140" fill="#fff" stroke="#e0e0e0"/>
  <text x="780" y="68" text-anchor="middle" font-size="11" fill="#37474f">unripe RGB hist</text>
  <polyline fill="none" stroke="#1565c0" stroke-width="1.5" points="710,165 740,155 770,150 800,145 840,160"/>
  <polyline fill="none" stroke="#2e7d32" stroke-width="2" points="710,150 740,100 770,70 800,90 840,130"/>
  <polyline fill="none" stroke="#c62828" stroke-width="1.5" points="710,170 740,165 770,160 800,155 840,165"/>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#424242">Each channel: 256 tone bins (0–255). OpenCV calcHist  compare ripe vs green profiles.</text>
  <text x="450" y="270" text-anchor="middle" font-size="12" fill="#616161">Background subtraction: keep pixels that change across frames (MOG2 / frame diff).</text>
  <text x="450" y="310" text-anchor="middle" font-size="11" fill="#9e9e9e">256 H 16.7M possible RGB colors</text>
</svg>
