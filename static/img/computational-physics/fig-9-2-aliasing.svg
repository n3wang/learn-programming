<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img">
<title>Figure 9.2 — aliasing of two sinusoids under sparse sampling</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="450" y="28" font-size="15" text-anchor="middle" fill="#212121">Figure 9.2 — sin(t/2) vs sin(2t): sparse samples can look identical</text>

<line x1="60" y1="220" x2="860" y2="220" stroke="#90a4ae" stroke-width="1.5"/>
<line x1="60" y1="60" x2="60" y2="380" stroke="#90a4ae" stroke-width="1.5"/>
<text x="870" y="224" font-size="12" fill="#546e7a">t</text>
<text x="48" y="70" font-size="12" fill="#546e7a">y</text>

<!-- low freq sin(pi t/2): period 4, amplitude 80 -->
<path d="M60,220 C100,140 140,140 180,220 C220,300 260,300 300,220 C340,140 380,140 420,220 C460,300 500,300 540,220 C580,140 620,140 660,220 C700,300 740,300 780,220 C820,140 840,160 860,180"
      fill="none" stroke="#1565c0" stroke-width="2.2"/>
<!-- high freq sin(2 pi t): period 1 -->
<path d="M60,220 C70,140 90,140 100,220 C110,300 130,300 140,220 C150,140 170,140 180,220 C190,300 210,300 220,220 C230,140 250,140 260,220 C270,300 290,300 300,220 C310,140 330,140 340,220 C350,300 370,300 380,220 C390,140 410,140 420,220 C430,300 450,300 460,220 C470,140 490,140 500,220 C510,300 530,300 540,220 C550,140 570,140 580,220 C590,300 610,300 620,220 C630,140 650,140 660,220 C670,300 690,300 700,220 C710,140 730,140 740,220 C750,300 770,300 780,220 C790,140 810,140 820,220 C830,300 845,280 860,250"
      fill="none" stroke="#c62828" stroke-width="1.6" opacity="0.85"/>

<!-- sample dots at t=0,2,4,6,8 where both ~0 -->
<circle cx="60" cy="220" r="6" fill="#2e7d32"/>
<circle cx="260" cy="220" r="6" fill="#2e7d32"/>
<circle cx="460" cy="220" r="6" fill="#2e7d32"/>
<circle cx="660" cy="220" r="6" fill="#2e7d32"/>
<circle cx="860" cy="220" r="6" fill="#2e7d32"/>
<text x="60" y="400" font-size="11" text-anchor="middle" fill="#2e7d32">0</text>
<text x="260" y="400" font-size="11" text-anchor="middle" fill="#2e7d32">2</text>
<text x="460" y="400" font-size="11" text-anchor="middle" fill="#2e7d32">4</text>
<text x="660" y="400" font-size="11" text-anchor="middle" fill="#2e7d32">6</text>
<text x="840" y="400" font-size="11" text-anchor="middle" fill="#2e7d32">8</text>

<!-- overlap samples (filled) near shared points -->
<circle cx="160" cy="160" r="5" fill="#f9a825" stroke="#e65100" stroke-width="1.5"/>
<circle cx="360" cy="280" r="5" fill="#f9a825" stroke="#e65100" stroke-width="1.5"/>
<circle cx="560" cy="160" r="5" fill="#f9a825" stroke="#e65100" stroke-width="1.5"/>
<circle cx="760" cy="280" r="5" fill="#f9a825" stroke="#e65100" stroke-width="1.5"/>

<text x="700" y="80" font-size="12" fill="#1565c0">sin(t/2)</text>
<text x="700" y="98" font-size="12" fill="#c62828">sin(2t)</text>
<text x="700" y="116" font-size="11" fill="#2e7d32"> samples t=0,2,&amp; (both H0)</text>
<text x="700" y="134" font-size="11" fill="#e65100"> shared samples (alias risk)</text>
</svg>
