<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img">
<title>Figure 6.3 — Newton–Raphson failure modes</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="380" y="26" font-size="14" text-anchor="middle" fill="#212121">When the guess is outside the nearly-linear neighborhood</text>

<!-- left panel: flat derivative -->
<rect x="20" y="44" width="350" height="236" fill="#fff" stroke="#e0e0e0" rx="4"/>
<text x="195" y="66" font-size="12" text-anchor="middle" fill="#424242">Left: f2 H 0 at an extremum  x  </text>
<line x1="50" y1="250" x2="350" y2="250" stroke="#555" stroke-width="1.2"/>
<line x1="50" y1="80" x2="50" y2="250" stroke="#555" stroke-width="1.2"/>
<path d="M70,210 C120,210 150,100 200,100 C250,100 280,210 340,210"
      fill="none" stroke="#455a64" stroke-width="2"/>
<circle cx="200" cy="100" r="4.5" fill="#c62828"/>
<text x="200" y="92" font-size="11" text-anchor="middle" fill="#c62828">guess</text>
<line x1="80" y1="100" x2="340" y2="100" stroke="#1565c0" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="200" y="274" font-size="11" text-anchor="middle" fill="#1565c0">horizontal tangent (no intercept)</text>

<!-- right panel: cycle -->
<rect x="390" y="44" width="350" height="236" fill="#fff" stroke="#e0e0e0" rx="4"/>
<text x="565" y="66" font-size="12" text-anchor="middle" fill="#424242">Right: guesses cycle — never settle on the root</text>
<line x1="420" y1="250" x2="720" y2="250" stroke="#555" stroke-width="1.2"/>
<line x1="420" y1="80" x2="420" y2="250" stroke="#555" stroke-width="1.2"/>
<path d="M440,120 C500,60 560,240 620,180 C660,145 700,200 710,220"
      fill="none" stroke="#455a64" stroke-width="2"/>
<!-- root mark -->
<circle cx="575" cy="250" r="3.5" fill="#2e7d32"/>
<text x="575" y="268" font-size="11" text-anchor="middle" fill="#2e7d32">root</text>
<!-- oscillating guesses -->
<circle cx="500" cy="95" r="4" fill="#c62828"/>
<circle cx="650" cy="165" r="4" fill="#c62828"/>
<line x1="500" y1="95" x2="650" y2="250" stroke="#1565c0" stroke-width="1.5"/>
<line x1="650" y1="165" x2="500" y2="250" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M510,120 C560,140 590,140 640,155" fill="none" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M640,180 C590,200 560,200 510,220" fill="none" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="565" y="155" font-size="11" text-anchor="middle" fill="#ef6c00">loop</text>

<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#ef6c00"/>
  </marker>
</defs>
</svg>
