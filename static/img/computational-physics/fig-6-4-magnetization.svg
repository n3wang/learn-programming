<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img">
<title>Figure 6.4 — f(m,t)=m−tanh(m/t) at three reduced temperatures</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="380" y="28" font-size="14" text-anchor="middle" fill="#212121">f(m,t)=m − tanh(m/t) vs reduced magnetization m</text>

<!-- axes -->
<line x1="70" y1="360" x2="720" y2="360" stroke="#555" stroke-width="1.5"/>
<line x1="70" y1="50" x2="70" y2="360" stroke="#555" stroke-width="1.5"/>
<text x="730" y="364" font-size="12" fill="#555">m</text>
<text x="48" y="48" font-size="12" fill="#555">f</text>
<line x1="70" y1="220" x2="720" y2="220" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
<text x="76" y="214" font-size="11" fill="#757575">0</text>
<text x="70" y="380" font-size="11" text-anchor="middle" fill="#555">0</text>
<text x="395" y="380" font-size="11" text-anchor="middle" fill="#555">0.5</text>
<text x="720" y="380" font-size="11" text-anchor="middle" fill="#555">1</text>

<!-- t=1.5: fHm-tanh(m/1.5) stays non-negative for m>0 (only root m=0) -->
<path d="M70,220 C200,200 350,170 520,140 C600,125 680,105 720,95"
      fill="none" stroke="#9e9e9e" stroke-width="2"/>
<text x="640" y="88" font-size="12" fill="#9e9e9e">t=1.5 (no spontaneous root)</text>

<!-- t=1.0: touches gently at 0, positive after -->
<path d="M70,220 C180,218 320,205 480,175 C600,150 680,120 720,100"
      fill="none" stroke="#1565c0" stroke-width="2.2"/>
<text x="520" y="155" font-size="12" fill="#1565c0">t=1.0 (=Tc)</text>

<!-- t=0.5: dips below then crosses near mH0.96 -->
<path d="M70,220 C120,250 200,300 320,310 C420,318 520,280 620,200 C660,160 700,130 720,120"
      fill="none" stroke="#c62828" stroke-width="2.4"/>
<circle cx="688" cy="220" r="5" fill="#c62828"/>
<text x="688" y="208" font-size="12" text-anchor="middle" fill="#c62828">mH0.9575</text>
<text x="280" y="340" font-size="12" fill="#c62828">t=0.5 (nontrivial zero)</text>

<!-- trivial root -->
<circle cx="70" cy="220" r="4" fill="#2e7d32"/>
<text x="95" y="210" font-size="11" fill="#2e7d32">m=0 always</text>

<rect x="90" y="55" width="280" height="70" fill="#fff" stroke="#bdbdbd" rx="4"/>
<text x="102" y="78" font-size="12" fill="#424242">For t &lt; 1: one physical root 0 &lt; m d 1</text>
<text x="102" y="98" font-size="12" fill="#424242">For t e 1: only m=0 (paramagnet)</text>
<text x="102" y="118" font-size="12" fill="#424242">Search f(m,tb)=0 at fixed tb</text>
</svg>
