<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img">
  <title>Figure 11.1 — biological neuron sketch</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="450" y="28" text-anchor="middle" font-size="14" fill="#212121">Figure 11.1 — neuron anatomy (schematic)</text>
  <!-- dendrites -->
  <g stroke="#1565c0" stroke-width="2.5" fill="none">
    <path d="M80 80 Q140 120 200 150"/>
    <path d="M70 160 Q130 160 200 160"/>
    <path d="M80 240 Q140 200 200 170"/>
  </g>
  <text x="70" y="70" font-size="12" fill="#1565c0">dendrites</text>
  <!-- soma -->
  <ellipse cx="260" cy="160" rx="55" ry="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="260" y="165" text-anchor="middle" font-size="12" fill="#0d47a1">cell body</text>
  <!-- axon -->
  <line x1="315" y1="160" x2="620" y2="160" stroke="#c62828" stroke-width="3"/>
  <text x="450" y="145" font-size="12" fill="#c62828">axon  action potential</text>
  <!-- terminals -->
  <g stroke="#ef6c00" stroke-width="2.5" fill="none">
    <path d="M620 160 Q700 100 780 70"/>
    <path d="M620 160 Q700 160 800 160"/>
    <path d="M620 160 Q700 220 780 250"/>
  </g>
  <text x="720" y="55" font-size="12" fill="#ef6c00">synaptic terminals</text>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#616161">Excitatory / inhibitory pulses  integrate  fire (or rest)</text>
</svg>
