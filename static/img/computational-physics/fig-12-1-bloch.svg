<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" role="img">
  <title>Figure 12.1 — Bloch sphere</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#212121">Figure 12.1 — Bloch sphere (schematic)</text>
  <ellipse cx="260" cy="240" rx="160" ry="160" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <ellipse cx="260" cy="240" rx="160" ry="55" fill="none" stroke="#90a4ae" stroke-dasharray="4 3"/>
  <line x1="260" y1="70" x2="260" y2="410" stroke="#c62828" stroke-width="2"/>
  <line x1="90" y1="240" x2="430" y2="240" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="140" y1="340" x2="380" y2="140" stroke="#ef6c00" stroke-width="1.5"/>
  <circle cx="260" cy="80" r="6" fill="#c62828"/>
  <text x="280" y="75" font-size="13" fill="#c62828">|0 (+z)</text>
  <circle cx="260" cy="400" r="6" fill="#c62828"/>
  <text x="280" y="410" font-size="13" fill="#c62828">|1 (−z)</text>
  <circle cx="340" cy="160" r="7" fill="#6a1b9a"/>
  <text x="355" y="155" font-size="12" fill="#6a1b9a">|</text>
  <text x="260" y="450" text-anchor="middle" font-size="12" fill="#424242">| = cos(/2)|0 + e^{i} sin(/2)|1</text>
</svg>
