<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" role="img">
  <title>Two-qubit X on q0, Z on q1</title>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <line x1="40" y1="50" x2="360" y2="50" stroke="#455a64" stroke-width="2"/>
  <line x1="40" y1="110" x2="360" y2="110" stroke="#455a64" stroke-width="2"/>
  <text x="48" y="40" font-size="12" fill="#1565c0">q0</text>
  <text x="48" y="100" font-size="12" fill="#1565c0">q1</text>
  <rect x="140" y="32" width="36" height="36" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="158" y="56" text-anchor="middle" font-size="14" fill="#0d47a1">X</text>
  <rect x="140" y="92" width="36" height="36" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="158" y="116" text-anchor="middle" font-size="14" fill="#4a148c">Z</text>
  <text x="280" y="56" font-size="12" fill="#2e7d32">to |10&gt;</text>
</svg>
