<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img">
<title>Figure 10.1 — chirp-like piecewise multi-tone signal</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="480" y="26" font-size="14" text-anchor="middle" fill="#212121">Figure 10.1 — signal gains more tones as time advances (boxes = STFT windows)</text>
<line x1="50" y1="180" x2="920" y2="180" stroke="#90a4ae"/>
<line x1="50" y1="50" x2="50" y2="310" stroke="#90a4ae"/>
<text x="930" y="184" font-size="12" fill="#546e7a">t</text>
<text x="38" y="60" font-size="12" fill="#546e7a">y</text>

<!-- region markers -->
<line x1="200" y1="175" x2="200" y2="185" stroke="#78909c"/>
<line x1="560" y1="175" x2="560" y2="185" stroke="#78909c"/>
<line x1="800" y1="175" x2="800" y2="185" stroke="#78909c"/>
<text x="125" y="320" font-size="11" text-anchor="middle" fill="#1565c0">0–2: 1 tone</text>
<text x="380" y="320" font-size="11" text-anchor="middle" fill="#ef6c00">2–8: 2 tones</text>
<text x="680" y="320" font-size="11" text-anchor="middle" fill="#c62828">8–12: 3 tones</text>

<!-- simplified waveform: increasing complexity -->
<path d="M50,180 Q80,120 110,180 Q140,240 170,180 Q200,180 200,180"
      fill="none" stroke="#1565c0" stroke-width="2"/>
<path d="M200,180 Q230,100 250,180 Q270,260 290,180 Q310,90 330,180 Q350,270 370,180 Q400,100 430,180 Q460,260 490,180 Q520,110 550,180"
      fill="none" stroke="#ef6c00" stroke-width="2"/>
<path d="M560,180 Q580,80 600,180 Q620,280 640,180 Q660,70 680,180 Q700,290 720,180 Q740,90 760,180 Q780,270 800,180"
      fill="none" stroke="#c62828" stroke-width="2"/>

<!-- STFT window boxes -->
<rect x="90" y="70" width="70" height="200" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
<rect x="320" y="70" width="90" height="200" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
<rect x="640" y="70" width="90" height="200" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
<text x="480" y="55" font-size="11" text-anchor="middle" fill="#2e7d32">dashed boxes H short-time Fourier windows</text>
</svg>
