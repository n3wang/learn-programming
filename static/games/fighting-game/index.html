<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive;
    }

    body {
      margin: 0;
    }

    button {
      font-size: 10px;
      color: white;
      background: black;
      border: 4px solid white;
      padding: 10px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #1f2937;
    }

    button.portrait:hover,
    button.map-card:hover {
      background: transparent;
    }

    button.map-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 4px;
      background: transparent;
    }

    button.map-card img {
      display: block;
      width: 128px;
      height: 72px;
      image-rendering: pixelated;
    }

    .menu-actions {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
      width: 22rem;
    }

    .menu-actions button {
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- red container div -->
  <div style="position: relative; display: inline-block">
    <!-- smaller red container div -->
    <div
      style="
        position: absolute;
        display: flex;
        width: 100%;
        align-items: center;
        padding: 20px;
      "
    >
      <!-- player health + stamina -->
      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
        <div
          style="
            position: relative;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            border-top: 4px solid white;
            border-left: 4px solid white;
            border-bottom: 4px solid white;
          "
        >
          <div style="background-color: red; height: 30px; width: 100%"></div>
          <div
            id="playerHealth"
            style="
              position: absolute;
              background: #818cf8;
              top: 0;
              right: 0;
              bottom: 0;
              width: 100%;
            "
          ></div>
        </div>
        <div
          style="
            position: relative;
            width: 100%;
            border: 3px solid white;
          "
        >
          <div style="background-color: #3f3f46; height: 10px; width: 100%"></div>
          <div
            id="playerStamina"
            style="
              position: absolute;
              background: #eab308;
              top: 0;
              right: 0;
              bottom: 0;
              width: 100%;
            "
          ></div>
        </div>
      </div>

      <!-- timer -->
      <div
        id="timer"
        style="
          background-color: black;
          width: 100px;
          height: 50px;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          border: 4px solid white;
        "
      >
        60
      </div>
      <!-- enemy health + stamina -->
      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
        <div
          style="
            position: relative;
            width: 100%;
            border-top: 4px solid white;
            border-bottom: 4px solid white;
            border-right: 4px solid white;
          "
        >
          <div style="background-color: red; height: 30px"></div>
          <div
            id="enemyHealth"
            style="
              position: absolute;
              background: #818cf8;
              top: 0;
              right: 0;
              bottom: 0;
              left: 0;
            "
          ></div>
        </div>
        <div
          style="
            position: relative;
            width: 100%;
            border: 3px solid white;
          "
        >
          <div style="background-color: #3f3f46; height: 10px; width: 100%"></div>
          <div
            id="enemyStamina"
            style="
              position: absolute;
              background: #eab308;
              top: 0;
              left: 0;
              bottom: 0;
              width: 100%;
            "
          ></div>
        </div>
      </div>
      <div></div>
    </div>
    <div
      id="testReadout"
      style="
        display: none;
        position: absolute;
        left: 20px;
        bottom: 16px;
        z-index: 2;
        color: white;
        font-size: 10px;
        line-height: 1.6;
        text-shadow: 2px 2px 0 #000;
      "
    ></div>
    <div
      id="displayText"
      style="
        position: absolute;
        z-index: 3;
        color: white;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: none;
      "
    >
      <div id="resultText">Tie</div>
      <button id="restartMatch" type="button">Restart</button>
    </div>
    <div
      id="pauseMenu"
      style="
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.72);
        color: white;
        z-index: 2;
        text-align: center;
      "
    >
      <div
        id="rosterP1"
        style="
          position: absolute;
          left: 28px;
          top: 72px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        "
      ></div>
      <div
        id="rosterP2"
        style="
          position: absolute;
          right: 28px;
          top: 72px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        "
      ></div>
      <div id="mapPicker" style="display: flex; gap: 12px; justify-content: center"></div>
      <div id="chooseTitle" style="font-size: 18px">Choose Fighters</div>
      <div id="pickerRow" style="display: flex; flex-direction: column; gap: 8px; font-size: 10px"></div>
      <div class="menu-actions">
        <button id="randomCharacters" type="button">Random Characters</button>
        <button id="startFight" type="button">Start</button>
        <button id="restartFight" type="button" style="display: none">Restart</button>
        <button id="testRange" type="button">Test Range</button>
      </div>
      <div
        id="characterStatsP1"
        style="
          position: absolute;
          left: 28px;
          bottom: 28px;
          width: 280px;
          border: 4px solid white;
          background: rgba(0, 0, 0, 0.82);
          padding: 12px 14px;
          text-align: left;
          font-size: 10px;
          line-height: 1.7;
        "
      ></div>
      <div
        id="characterStatsP2"
        style="
          position: absolute;
          right: 28px;
          bottom: 28px;
          width: 280px;
          border: 4px solid #3b82f6;
          background: rgba(0, 0, 0, 0.82);
          padding: 12px 14px;
          text-align: left;
          font-size: 10px;
          line-height: 1.7;
        "
      ></div>
    </div>
    <canvas></canvas>
  </div>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"
    integrity="sha512-H6cPm97FAsgIKmlBA4s774vqoN24V5gSQL4yBTDOY2su2DeXZVhQPxFK4P6GPdnZqM9fg1G3cMv5wD7e6cFLZQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="js/utils.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/classes.js"></script>
  <script src="index.js"></script>
</body>
