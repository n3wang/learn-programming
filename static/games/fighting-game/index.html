<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive;
    }

    body {
      margin: 0;
    }

    button {
      font-size: 10px;
      color: white;
      background: black;
      border: 4px solid white;
      padding: 10px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #1f2937;
    }
  </style>
</head>
<body>
  <!-- red container div -->
  <div style="position: relative; display: inline-block">
    <!-- smaller red container div -->
    <div
      style="
        position: absolute;
        display: flex;
        width: 100%;
        align-items: center;
        padding: 20px;
      "
    >
      <!-- player health + stamina -->
      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
        <div
          style="
            position: relative;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            border-top: 4px solid white;
            border-left: 4px solid white;
            border-bottom: 4px solid white;
          "
        >
          <div style="background-color: red; height: 30px; width: 100%"></div>
          <div
            id="playerHealth"
            style="
              position: absolute;
              background: #818cf8;
              top: 0;
              right: 0;
              bottom: 0;
              width: 100%;
            "
          ></div>
        </div>
        <div
          style="
            position: relative;
            width: 100%;
            border: 3px solid white;
          "
        >
          <div style="background-color: #3f3f46; height: 10px; width: 100%"></div>
          <div
            id="playerStamina"
            style="
              position: absolute;
              background: #eab308;
              top: 0;
              right: 0;
              bottom: 0;
              width: 100%;
            "
          ></div>
        </div>
      </div>

      <!-- timer -->
      <div
        id="timer"
        style="
          background-color: black;
          width: 100px;
          height: 50px;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          border: 4px solid white;
        "
      >
        60
      </div>
      <!-- enemy health + stamina -->
      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
        <div
          style="
            position: relative;
            width: 100%;
            border-top: 4px solid white;
            border-bottom: 4px solid white;
            border-right: 4px solid white;
          "
        >
          <div style="background-color: red; height: 30px"></div>
          <div
            id="enemyHealth"
            style="
              position: absolute;
              background: #818cf8;
              top: 0;
              right: 0;
              bottom: 0;
              left: 0;
            "
          ></div>
        </div>
        <div
          style="
            position: relative;
            width: 100%;
            border: 3px solid white;
          "
        >
          <div style="background-color: #3f3f46; height: 10px; width: 100%"></div>
          <div
            id="enemyStamina"
            style="
              position: absolute;
              background: #eab308;
              top: 0;
              left: 0;
              bottom: 0;
              width: 100%;
            "
          ></div>
        </div>
      </div>
      <div></div>
    </div>
    <div
      id="displayText"
      style="
        position: absolute;
        z-index: 3;
        color: white;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: none;
      "
    >
      <div id="resultText">Tie</div>
      <button id="restartMatch" type="button">Restart</button>
    </div>
    <div
      id="pauseMenu"
      style="
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.72);
        color: white;
        z-index: 2;
        text-align: center;
      "
    >
      <div style="font-size: 18px">Choose Fighters</div>
      <div id="p1Choice" style="font-size: 10px">P1: Samurai</div>
      <div id="p2Choice" style="font-size: 10px">P2: Kenji</div>
      <button id="switchCharacters" type="button">Switch Characters</button>
      <button id="startFight" type="button">Start</button>
    </div>
    <canvas></canvas>
  </div>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"
    integrity="sha512-H6cPm97FAsgIKmlBA4s774vqoN24V5gSQL4yBTDOY2su2DeXZVhQPxFK4P6GPdnZqM9fg1G3cMv5wD7e6cFLZQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="js/utils.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/classes.js"></script>
  <script src="index.js"></script>
</body>
